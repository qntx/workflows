[package]
name = "fixture-fuzz-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.fixture-fuzz]
path = ".."

[[bin]]
name = "smoke"
path = "fuzz_targets/smoke.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runs"
path = "fuzz_targets/runs.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
