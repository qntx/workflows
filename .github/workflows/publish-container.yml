name: Publish / container

# Permissions cannot vary by input, so build (push: false) and publish (push: true)
# are mutually exclusive jobs.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 45
      registry:
        description: 'Container registry to push to.'
        required: false
        type: string
        default: 'ghcr.io'
      image-name:
        description: 'Image name (defaults to github.repository).'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms. Canonical default is dual-arch.'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Whether to push the image.'
        required: false
        type: boolean
        default: true
      dockerfile:
        description: 'Path to the Containerfile/Dockerfile. Empty auto-detects Dockerfile then Containerfile.'
        required: false
        type: string
        default: ''
      context:
        description: 'Build context path.'
        required: false
        type: string
        default: '.'
      no-cache:
        description: 'Disable build cache (force rebuild).'
        required: false
        type: boolean
        default: false
      attest:
        description: 'Emit build provenance. Default true; callers without id-token must set false.'
        required: false
        type: boolean
        default: true
    secrets:
      REGISTRY_USERNAME:
        description: 'Optional registry username (defaults to github.actor).'
        required: false
      REGISTRY_PASSWORD:
        description: 'Optional registry password (defaults to GITHUB_TOKEN).'
        required: false
    outputs:
      digest:
        description: 'Image digest from buildx (publish job). Empty when push is false.'
        value: ${{ jobs.publish.outputs.digest || jobs.build.outputs.digest }}
      image:
        description: 'registry/image without digest'
        value: ${{ jobs.publish.outputs.image || jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: qntx-workflows-publish-container-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image-name || github.repository }}

jobs:
  build:
    if: ${{ !inputs.push }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - name: Detect Containerfile
        id: detect
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKERFILE" ]; then
            path="$DOCKERFILE"
          elif [ -f "$CONTEXT/Dockerfile" ]; then
            path="$CONTEXT/Dockerfile"
          elif [ -f "$CONTEXT/Containerfile" ]; then
            path="$CONTEXT/Containerfile"
          else
            echo "::error::No Dockerfile or Containerfile found under ${CONTEXT}."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.detect.outputs.path }}
          platforms: ${{ inputs.platforms }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ !inputs.no-cache && 'type=gha' || '' }}
          cache-to: ${{ !inputs.no-cache && 'type=gha,mode=max' || '' }}

  publish:
    if: ${{ inputs.push }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - name: Detect Containerfile
        id: detect
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKERFILE" ]; then
            path="$DOCKERFILE"
          elif [ -f "$CONTEXT/Dockerfile" ]; then
            path="$CONTEXT/Dockerfile"
          elif [ -f "$CONTEXT/Containerfile" ]; then
            path="$CONTEXT/Containerfile"
          else
            echo "::error::No Dockerfile or Containerfile found under ${CONTEXT}."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.detect.outputs.path }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no-cache }}
          cache-from: ${{ !inputs.no-cache && 'type=gha' || '' }}
          cache-to: ${{ !inputs.no-cache && 'type=gha,mode=max' || '' }}
          provenance: mode=max
          sbom: true

      - name: Generate artifact attestation
        if: ${{ inputs.attest && steps.build.outputs.digest != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
