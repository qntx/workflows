name: CI / Foundry

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      foundry-version:
        description: 'Foundry toolchain version (stable, nightly, or a commit).'
        required: false
        type: string
        default: 'stable'
      foundry-profile:
        description: 'Foundry profile to use (requires a matching [profile.*] section in foundry.toml).'
        required: false
        type: string
        default: 'ci'

permissions:
  contents: read

concurrency:
  group: qntx-workflows-ci-foundry-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ${{ inputs.foundry-profile }}

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ inputs.foundry-version }}

      - name: Record toolchain
        run: |
          set -euo pipefail
          forge --version
          {
            echo '## CI / Foundry'
            echo "- forge: $(forge --version)"
            echo "- FOUNDRY_PROFILE: $FOUNDRY_PROFILE"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
