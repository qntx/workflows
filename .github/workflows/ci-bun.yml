name: CI / Bun

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 20
      bun-version:
        description: 'Bun version. Not latest.'
        required: false
        type: string
        default: '1.4'
      install-command:
        description: 'Trusted-caller install command.'
        required: false
        type: string
        default: 'bun install --frozen-lockfile'
      rust:
        description: 'Install the Rust toolchain before dependencies. Honours the working-directory rust-toolchain file, else stable. For repo scripts that drive cargo (cross-language differential tests).'
        required: false
        type: boolean
        default: false
      scripts:
        description: 'Whitespace-separated package script names run with bun run in order after Test.'
        required: false
        type: string
        default: ''
      scripts-directory:
        description: 'Directory for the Extra scripts step. Empty runs them in working-directory. Relative to the repository root.'
        required: false
        type: string
        default: ''
      node-version-file:
        description: 'Path to a .node-version-style file, relative to the repository root. When set, actions/setup-node installs that version after Bun.'
        required: false
        type: string
        default: ''
      require-clean-tree:
        description: 'Fail the job when a CI step leaves uncommitted changes in tracked files (e.g. a forgotten generated file).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Set up Rust
        if: ${{ inputs.rust }}
        uses: $/actions/setup-rust
        with:
          working-directory: ${{ inputs.working-directory }}
          components: ''

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Validate node-version-file
        if: ${{ inputs.node-version-file != '' }}
        env:
          NVF: ${{ inputs.node-version-file }}
        run: |
          set -euo pipefail
          if ! [[ "$NVF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$NVF" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::node-version-file charset or '..' segment: ${NVF}"
            exit 1
          fi

      - name: Set up Node.js
        if: ${{ inputs.node-version-file != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Record toolchain
        env:
          RUST: ${{ inputs.rust }}
          NVF: ${{ inputs.node-version-file }}
        run: |
          set -euo pipefail
          {
            echo '## CI / Bun'
            echo "- bun: $(bun --version)"
            if [ "$RUST" = 'true' ]; then
              echo "- rustc: $(rustc --version)"
              echo "- cargo: $(cargo --version)"
            fi
            if [ -n "$NVF" ]; then
              echo "- node: $(node --version)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # Last setup step: a success outcome here means the whole setup chain
      # ran clean, so the gates below key off steps.install.
      - name: Install dependencies
        id: install
        uses: $/actions/run-trusted-command
        with:
          command: ${{ inputs.install-command }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then
            bun run lint
          else
            echo 'No lint script defined, skipping.'
            echo '- skipped: lint' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.typecheck' package.json > /dev/null 2>&1; then
            bun run typecheck
          else
            echo 'No typecheck script defined, skipping.'
            echo '- skipped: typecheck' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.build' package.json > /dev/null 2>&1; then
            bun run build
          else
            echo 'No build script defined, skipping.'
            echo '- skipped: build' >>"$GITHUB_STEP_SUMMARY"
          fi

      # Test consumes the build output, so it only skips when Build failed.
      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build.outcome != 'failure' }}
        run: |
          set -euo pipefail
          # scripts.test wins: the file heuristic only searches three levels
          # deep and would misdetect a monorepo (packages/*/tests/*) as having
          # no tests, or run a different runner than the declared script.
          if jq -e '.scripts.test' package.json > /dev/null 2>&1; then
            bun run test
          elif find . -maxdepth 3 -not -path './node_modules/*' -not -path './.git/*' \
               \( -name '*.test.*' -o -name '*.spec.*' -o -path './test/*' -o -path './tests/*' \) \
               -print -quit | grep -q .; then
            bun test
          else
            echo 'No tests found, skipping.'
            echo '- skipped: test' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Extra scripts
        id: scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build.outcome != 'failure' && inputs.scripts != '' }}
        working-directory: ${{ inputs.scripts-directory != '' && inputs.scripts-directory || inputs.working-directory }}
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          # word-split is intentional: whitespace-separated script names
          # shellcheck disable=SC2086
          for s in $SCRIPTS; do
            if ! [[ "$s" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "::error::scripts entry charset: ${s}"
              exit 1
            fi
            bun run "$s"
          done

      # A failed generator would only add noise, so the gate requires the
      # build and extra scripts to have at least run without failing.
      - name: Clean tree
        id: clean-tree
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build.outcome != 'failure' && steps.scripts.outcome != 'failure' && inputs.require-clean-tree }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Tracked files only: untracked files are not considered.
          if ! git diff --exit-code --stat; then
            {
              echo '### Uncommitted changes after the CI steps'
              echo ''
              echo '```'
              git diff --stat
              echo '```'
              echo ''
              git diff --name-only | sed 's/^/- /'
            } >>"$GITHUB_STEP_SUMMARY"
            n="$(git diff --name-only | wc -l | tr -d ' ')"
            echo "::error title=CI / Bun::uncommitted changes after the CI steps: ${n} files"
            exit 1
          fi

      # Verdict step: runs even when a gate failed so the summary table and
      # the failure annotation are always produced. Not on cancellation.
      - name: Gates
        id: gates
        if: ${{ !cancelled() }}
        env:
          SETUP: ${{ steps.install.outcome }}
          R_LINT: ${{ steps.lint.outcome }}
          R_TYPECHECK: ${{ steps.typecheck.outcome }}
          R_BUILD: ${{ steps.build.outcome }}
          R_TEST: ${{ steps.test.outcome }}
          R_SCRIPTS: ${{ steps.scripts.outcome }}
          R_CLEAN_TREE: ${{ steps.clean-tree.outcome }}
        run: |
          set -euo pipefail
          verdict() {
            local failure=0 success=0 skipped=0 o
            for o in "$@"; do
              case "$o" in
                failure | cancelled) failure=1 ;;
                success) success=1 ;;
                skipped) skipped=1 ;;
              esac
            done
            if ((failure)); then
              echo '**fail**'
            elif ((success)); then
              echo 'pass'
            elif ((skipped)); then
              echo 'skip'
            else
              echo 'not run'
            fi
          }
          names=() results=() failed=()
          emit() {
            local name="$1" v
            shift
            v="$(verdict "$@")"
            names+=("$name")
            results+=("$v")
            if [[ "$v" == '**fail**' ]]; then
              failed+=("$name")
            fi
          }
          emit lint "$R_LINT"
          emit typecheck "$R_TYPECHECK"
          emit build "$R_BUILD"
          emit test "$R_TEST"
          emit scripts "$R_SCRIPTS"
          emit clean-tree "$R_CLEAN_TREE"
          {
            echo '## CI / Bun gates'
            echo
            if [[ "$SETUP" != success ]]; then
              echo "Setup failed before the gates ran (install: ${SETUP:-not run})."
              echo
            fi
            echo '| Gate | Result |'
            echo '| ---- | ------ |'
            for i in "${!names[@]}"; do
              echo "| ${names[$i]} | ${results[$i]} |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          if ((${#failed[@]})); then
            printf -v list '%s, ' "${failed[@]}"
            echo "::error title=CI / Bun::failed gates: ${list%, }"
            exit 1
          fi
