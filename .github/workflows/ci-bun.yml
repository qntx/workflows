name: CI / Bun

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 20
      bun-version:
        description: 'Bun version. Not latest.'
        required: false
        type: string
        default: '1.4'
      install-command:
        description: 'Trusted-caller install command.'
        required: false
        type: string
        default: 'bun install --frozen-lockfile'
      rust:
        description: 'Install the Rust toolchain before dependencies. Honours the working-directory rust-toolchain file, else stable. For repo scripts that drive cargo (cross-language differential tests).'
        required: false
        type: boolean
        default: false
      scripts:
        description: 'Whitespace-separated package script names run with bun run in order after Test.'
        required: false
        type: string
        default: ''
      scripts-directory:
        description: 'Directory for the Extra scripts step. Empty runs them in working-directory. Relative to the repository root.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Set up Rust
        if: ${{ inputs.rust }}
        uses: $/actions/setup-rust
        with:
          working-directory: ${{ inputs.working-directory }}
          components: ''

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Record toolchain
        env:
          RUST: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          {
            echo '## CI / Bun'
            echo "- bun: $(bun --version)"
            if [ "$RUST" = 'true' ]; then
              echo "- rustc: $(rustc --version)"
              echo "- cargo: $(cargo --version)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        uses: $/actions/run-trusted-command
        with:
          command: ${{ inputs.install-command }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lint
        run: |
          set -euo pipefail
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then
            bun run lint
          else
            echo 'No lint script defined, skipping.'
            echo '- skipped: lint' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck
        run: |
          set -euo pipefail
          if jq -e '.scripts.typecheck' package.json > /dev/null 2>&1; then
            bun run typecheck
          else
            echo 'No typecheck script defined, skipping.'
            echo '- skipped: typecheck' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: |
          set -euo pipefail
          if jq -e '.scripts.build' package.json > /dev/null 2>&1; then
            bun run build
          else
            echo 'No build script defined, skipping.'
            echo '- skipped: build' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Test
        run: |
          set -euo pipefail
          # scripts.test wins: the file heuristic only searches three levels
          # deep and would misdetect a monorepo (packages/*/tests/*) as having
          # no tests, or run a different runner than the declared script.
          if jq -e '.scripts.test' package.json > /dev/null 2>&1; then
            bun run test
          elif find . -maxdepth 3 -not -path './node_modules/*' -not -path './.git/*' \
               \( -name '*.test.*' -o -name '*.spec.*' -o -path './test/*' -o -path './tests/*' \) \
               -print -quit | grep -q .; then
            bun test
          else
            echo 'No tests found, skipping.'
            echo '- skipped: test' >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Extra scripts
        if: ${{ inputs.scripts != '' }}
        working-directory: ${{ inputs.scripts-directory != '' && inputs.scripts-directory || inputs.working-directory }}
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          # word-split is intentional: whitespace-separated script names
          # shellcheck disable=SC2086
          for s in $SCRIPTS; do
            if ! [[ "$s" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "::error::scripts entry charset: ${s}"
              exit 1
            fi
            bun run "$s"
          done
