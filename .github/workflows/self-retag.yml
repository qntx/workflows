name: Self / Retag

# Rollback only: point the v<major> alias back at a published vX.Y.Z release.
# Routine retagging after a release lives in self-release.yml; this workflow
# never moves the alias to origin/main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to point the major alias at (vX.Y.Z).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qntx-workflows-self-retag-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: retag
    permissions:
      contents: write
    steps:
      - uses: $/actions/hardened-checkout
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Move major tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match ^v[0-9]+\.[0-9]+\.[0-9]+$ (got ${TAG})"
            exit 1
          fi

          # Dispatch ref is not origin/main. Do not peel HEAD.
          git fetch origin main --tags --force

          if [ "$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)" != tag ]; then
            echo "::error::${TAG} is not an annotated tag on origin"
            exit 1
          fi

          major="${TAG%%.*}"
          rel_sha="$(git rev-parse "${TAG}^{commit}")"
          git tag -f -a "$major" -m "track ${TAG}" "$rel_sha"
          git push -f origin "$major"

          peeled="$(git rev-parse "${major}^{commit}")"
          if [ "$peeled" != "$rel_sha" ]; then
            echo "::error::${major}^{commit} ${peeled} != ${TAG}^{commit} ${rel_sha}"
            exit 1
          fi
          {
            echo "${TAG}^{commit}=${rel_sha}"
            echo "${major}^{commit}=${peeled}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
