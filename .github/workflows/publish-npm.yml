name: Publish / npm

# Non-empty NPM_TOKEN ⇒ token path, never --provenance; caller need not grant id-token.
# Empty NPM_TOKEN ⇒ OIDC path, always --provenance; caller must set id-token: write.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      package-manager:
        description: 'npm, pnpm, yarn, or bun. Not auto-detected.'
        required: false
        type: string
        default: 'npm'
      node-version:
        description: 'Node.js for npm CLI (>=24 ships npm 11 for OIDC).'
        required: false
        type: string
        default: '24'
      bun-version:
        description: 'Used only when package-manager is bun.'
        required: false
        type: string
        default: '1.4'
      access:
        description: 'Package access level (public or restricted).'
        required: false
        type: string
        default: 'public'
      registry-url:
        description: 'npm registry URL.'
        required: false
        type: string
        default: 'https://registry.npmjs.org'
      provenance:
        description: 'Ignored on the token path. OIDC path always passes --provenance.'
        required: false
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        description: 'Optional. When set, token path is used and provenance is off.'
        required: false
    outputs:
      package:
        description: 'package.json name'
        value: ${{ jobs.publish.outputs.package }}
      version:
        description: 'package.json version'
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: qntx-workflows-publish-npm-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      package: ${{ steps.pkg.outputs.package }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm) npm ci ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              if yarn --version | grep -q '^1\.'; then
                yarn install --frozen-lockfile
              else
                yarn install --immutable
              fi
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac

      - name: Build
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm)
              npm run build --if-present
              ;;
            bun)
              if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
                bun run build
              fi
              ;;
            *)
              if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
                "$PM" run build
              fi
              ;;
          esac

      - name: Test
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm)
              npm test --if-present
              ;;
            bun)
              if find . -maxdepth 3 -not -path './node_modules/*' -not -path './.git/*' \
                   \( -name '*.test.*' -o -name '*.spec.*' -o -path './test/*' -o -path './tests/*' \) \
                   -print -quit | grep -q .; then
                bun test
              fi
              ;;
            *)
              if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
                "$PM" test
              fi
              ;;
          esac

      - id: pkg
        run: |
          set -euo pipefail
          echo "package=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (OIDC)
        if: ${{ steps.auth.outputs.mode == 'oidc' }}
        env:
          ACCESS: ${{ inputs.access }}
        run: npm publish --access "$ACCESS" --provenance

      - name: Publish (token)
        if: ${{ steps.auth.outputs.mode == 'token' }}
        env:
          ACCESS: ${{ inputs.access }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access "$ACCESS"
