name: Publish / npm

# Token and OIDC need different job permissions; GitHub will not let one job
# request id-token: write when the caller only granted contents: read.
# jobs.publish = token. jobs.oidc = OIDC. Both set name: publish.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      install-directory:
        description: 'Workspace root for install and lockfile cache. Monorepos keep this at the repository root.'
        required: false
        type: string
        default: '.'
      working-directory:
        description: 'Package directory to build, test, and npm publish. Independent of install-directory.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      package-manager:
        description: 'npm, pnpm, yarn, or bun. Not auto-detected.'
        required: false
        type: string
        default: 'npm'
      node-version:
        description: 'Node.js for npm CLI (>=24 ships npm 11 for OIDC).'
        required: false
        type: string
        default: '24'
      bun-version:
        description: 'Used only when package-manager is bun.'
        required: false
        type: string
        default: '1.4'
      access:
        description: 'Package access level (public or restricted).'
        required: false
        type: string
        default: 'public'
      registry-url:
        description: 'npm registry URL.'
        required: false
        type: string
        default: 'https://registry.npmjs.org'
      provenance:
        description: 'Ignored on the token path. OIDC path always passes --provenance.'
        required: false
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        description: 'Optional. When set, token path is used and provenance is off.'
        required: false
    outputs:
      package:
        description: 'package.json name'
        value: ${{ jobs.publish.outputs.package || jobs.oidc.outputs.package }}
      version:
        description: 'package.json version'
        value: ${{ jobs.publish.outputs.version || jobs.oidc.outputs.version }}

permissions:
  contents: read

concurrency:
  group: qntx-workflows-publish-npm-${{ github.repository }}-${{ github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.r.outputs.mode }}
    steps:
      - id: r
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN}" ]; then
            echo 'mode=token' >>"$GITHUB_OUTPUT"
          else
            echo 'mode=oidc' >>"$GITHUB_OUTPUT"
          fi

  publish:
    name: publish
    needs: route
    if: ${{ needs.route.outputs.mode == 'token' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      package: ${{ steps.run.outputs.package }}
      version: ${{ steps.run.outputs.version }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - id: run
        uses: $/actions/publish-npm
        with:
          install-directory: ${{ inputs.install-directory }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          bun-version: ${{ inputs.bun-version }}
          access: ${{ inputs.access }}
          registry-url: ${{ inputs.registry-url }}
          provenance: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  oidc:
    name: publish
    needs: route
    if: ${{ needs.route.outputs.mode == 'oidc' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    outputs:
      package: ${{ steps.run.outputs.package }}
      version: ${{ steps.run.outputs.version }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - id: run
        uses: $/actions/publish-npm
        with:
          install-directory: ${{ inputs.install-directory }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          bun-version: ${{ inputs.bun-version }}
          access: ${{ inputs.access }}
          registry-url: ${{ inputs.registry-url }}
          provenance: true
