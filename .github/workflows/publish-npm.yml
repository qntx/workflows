name: Publish / npm

# OIDC trusted publishing only. The caller job must grant `id-token: write`
# and each package needs a Trusted Publisher on npmjs.com naming the caller
# repository and this workflow. `npm publish` always passes `--provenance`
# unless `dry-run` is set, which publishes with `--dry-run` and no provenance.
#
# The workflow splits into an unprivileged `pack` job (install, build, test,
# files check, npm pack — no token) and a privileged `publish` job that only
# downloads the tarball, verifies its sha256, and runs `npm publish` — no
# checkout, install or build, so a compromised build cannot alter what is
# signed or reach the OIDC token.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      install-directory:
        description: 'Workspace root for install and lockfile cache. Monorepos keep this at the repository root.'
        required: false
        type: string
        default: '.'
      working-directory:
        description: 'Package directory to build, test, and npm publish. Independent of install-directory.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      package-manager:
        description: 'npm, pnpm, yarn, or bun. Not auto-detected.'
        required: false
        type: string
        default: 'npm'
      node-version:
        description: 'Node.js for npm CLI (trusted publishing needs npm >= 11.5.1; Node 24 ships it).'
        required: false
        type: string
        default: '24'
      bun-version:
        description: 'Used only when package-manager is bun.'
        required: false
        type: string
        default: '1.4'
      access:
        description: 'Package access level (public or restricted).'
        required: false
        type: string
        default: 'public'
      wasm:
        description: 'When true, setup-wasm runs in the pack job ahead of one build:wasm. npm publish always passes --ignore-scripts. Callers set timeout-minutes to 30. Default false keeps the generic build and the 15 minute timeout.'
        required: false
        type: boolean
        default: false
      language:
        description: 'Wasm toolchain language: rust (default; cargo cdylib build) or c (clang only; cargo-directory is ignored). Used only when wasm is true.'
        required: false
        type: string
        default: 'rust'
      cargo-directory:
        description: 'Cargo workspace relative to the repository root. Used only when wasm is true. Jailed. Lockfile lookup only. No wasm-bindgen version override.'
        required: false
        type: string
        default: '.'
      dist-export:
        description: 'Package exports key checked by the wasm package and dist contracts. Used only when wasm is true. "." selects the root export of a dedicated wasm package.'
        required: false
        type: string
        default: './wasm'
      dry-run:
        description: 'Run every step as usual but publish with npm publish --dry-run (no --provenance; the OIDC token is unused). The already-published check still runs.'
        required: false
        type: boolean
        default: false
      artifact:
        description: 'upload-artifact name downloaded into working-directory before the publish steps run (prebuilt binaries, e.g. native modules). Layout must be relative to the package directory. Empty downloads nothing.'
        required: false
        type: string
        default: ''
    outputs:
      package:
        description: 'package.json name'
        value: ${{ jobs.publish.outputs.package }}
      version:
        description: 'package.json version'
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read

concurrency:
  group: qntx-workflows-publish-npm-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      package: ${{ steps.run.outputs.package }}
      version: ${{ steps.run.outputs.version }}
      artifact: ${{ steps.run.outputs.artifact }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - name: Set up wasm toolchain
        if: ${{ inputs.wasm }}
        uses: $/actions/setup-wasm
        with:
          toolchain: true
          dist-check: false
          language: ${{ inputs.language }}
          cargo-directory: ${{ inputs.cargo-directory }}
          dist-export: ${{ inputs.dist-export }}
          package-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          install-directory: ${{ inputs.install-directory }}
          targets: wasm32-unknown-unknown
          cache-key: wasm32
      - name: Download prebuilt artifact
        if: ${{ inputs.artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.working-directory }}
      - id: run
        uses: $/actions/pack-npm
        with:
          install-directory: ${{ inputs.install-directory }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          bun-version: ${{ inputs.bun-version }}
          wasm: ${{ inputs.wasm }}
          language: ${{ inputs.language }}
          dist-export: ${{ inputs.dist-export }}

  publish:
    needs: pack
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      package: ${{ needs.pack.outputs.package }}
      version: ${{ needs.pack.outputs.version }}
    steps:
      - uses: $/actions/publish-npm
        with:
          artifact: ${{ needs.pack.outputs.artifact }}
          package: ${{ needs.pack.outputs.package }}
          version: ${{ needs.pack.outputs.version }}
          node-version: ${{ inputs.node-version }}
          access: ${{ inputs.access }}
          dry-run: ${{ inputs.dry-run }}
