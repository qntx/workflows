name: CI / Dart

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 20
      dart-version:
        description: 'Dart SDK channel or version (was input id sdk).'
        required: false
        type: string
        default: 'stable'

permissions:
  contents: read

concurrency:
  group: qntx-workflows-ci-dart-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ inputs.dart-version }}

      - name: Record toolchain
        run: |
          set -euo pipefail
          {
            echo '## CI / Dart'
            echo "- dart: $(dart --version 2>&1)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test
