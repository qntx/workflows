name: CI / Docs

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 20
      bun-version:
        description: 'Bun version. Not latest.'
        required: false
        type: string
        default: '1.4'
      docs-path:
        description: 'Docs tree relative to working-directory. Default docs.'
        required: false
        type: string
        default: 'docs'

permissions:
  contents: read

concurrency:
  group: qntx-workflows-ci-docs-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Record toolchain
        env:
          WF_SHA: ${{ job.workflow_sha }}
          WF_REPO: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          {
            echo '## CI / Docs'
            echo "- bun: $(bun --version)"
            echo "- workflow: ${WF_REPO}@${WF_SHA}"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: $/actions/validate-docs-tree
        with:
          working-directory: ${{ inputs.working-directory }}
          docs-path: ${{ inputs.docs-path }}
