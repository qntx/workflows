name: Release

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      files:
        description: 'Newline-separated glob patterns of assets to attach to the release.'
        required: false
        type: string
        default: ''
      download-artifacts:
        description: 'Download artifacts from the current workflow run before creating the release.'
        required: false
        type: boolean
        default: false
      artifact-pattern:
        description: 'Only download artifacts whose name matches this pattern (ignored if download-artifacts is false).'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create the release as a draft.'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Prerelease flag. auto: hyphen then alpha|beta|rc|preview|pre|dev|nightly, then end, `.`, `-`, or a digit (keeps rc1).'
        required: false
        type: string
        default: 'auto'
      cliff-config:
        description: 'Path to a git-cliff configuration file (empty uses the action default).'
        required: false
        type: string
        default: ''
      cliff-args:
        description: 'Arguments passed to git-cliff.'
        required: false
        type: string
        default: '--latest --strip header'
      tag-name:
        description: 'Tag name for the release. Defaults to the tag that triggered the workflow.'
        required: false
        type: string
        default: ''
      name:
        description: 'Release title. Defaults to the tag name.'
        required: false
        type: string
        default: ''
    outputs:
      release-url:
        description: 'URL of the created GitHub Release.'
        value: ${{ jobs.release.outputs.release-url }}
      tag-name:
        description: 'Tag name of the release.'
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  contents: write

concurrency:
  group: qntx-workflows-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.gh-release.outputs.url }}
      tag-name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EXPLICIT: ${{ inputs.tag-name }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT" ]; then
            tag="$EXPLICIT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            echo '::error::No tag available; pass tag-name or trigger this workflow from a tag.'
            exit 1
          fi
          echo "name=$tag" >>"$GITHUB_OUTPUT"

      - name: Resolve prerelease flag
        id: pre
        shell: bash
        env:
          MODE: ${{ inputs.prerelease }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          case "$MODE" in
            auto)
              if [[ "$TAG" =~ -(alpha|beta|rc|preview|pre|dev|nightly)($|[.0-9-]) ]]; then
                flag=true
              else
                flag=false
              fi
              ;;
            true) flag=true ;;
            false) flag=false ;;
            *)
              echo "::error::prerelease must be 'auto', 'true', or 'false' (got: $MODE)"
              exit 1
              ;;
          esac
          echo "flag=$flag" >>"$GITHUB_OUTPUT"

      - name: Download artifacts
        if: inputs.download-artifacts && inputs.artifact-pattern != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          pattern: ${{ inputs.artifact-pattern }}

      - name: Download artifacts
        if: inputs.download-artifacts && inputs.artifact-pattern == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate changelog (default config)
        if: inputs.cliff-config == ''
        id: cliff_default
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          args: ${{ inputs.cliff-args }}

      - name: Generate changelog (custom config)
        if: inputs.cliff-config != ''
        id: cliff_custom
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: ${{ inputs.cliff-config }}
          args: ${{ inputs.cliff-args }}

      - name: Create GitHub Release
        id: gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ inputs.name || steps.tag.outputs.name }}
          body: ${{ steps.cliff_custom.outputs.content || steps.cliff_default.outputs.content }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ steps.pre.outputs.flag }}
          files: ${{ inputs.files }}
          make_latest: ${{ steps.pre.outputs.flag == 'false' && 'true' || 'false' }}

      - name: Summarize
        env:
          URL: ${{ steps.gh-release.outputs.url }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "Released ${TAG}: ${URL}" >>"$GITHUB_STEP_SUMMARY"
