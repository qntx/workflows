name: Deploy / Pages

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      path:
        description: 'Directory containing the built site to upload.'
        required: false
        type: string
        default: 'dist'
      bun-version:
        description: 'Bun version to install.'
        required: false
        type: string
        default: '1.4'
      install-command:
        description: 'Command used to install dependencies.'
        required: false
        type: string
        default: 'bun install --frozen-lockfile'
      build-command:
        description: 'Command used to build the site.'
        required: false
        type: string
        default: 'bun run build'
    outputs:
      page-url:
        description: 'GitHub Pages URL. Empty on pull_request.'
        value: ${{ jobs.deploy.outputs.page-url }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qntx-workflows-deploy-pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        uses: $/actions/run-trusted-command
        with:
          command: ${{ inputs.install-command }}

      - name: Build
        uses: $/actions/run-trusted-command
        with:
          command: ${{ inputs.build-command }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.path }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
