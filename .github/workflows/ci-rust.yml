name: CI / Rust

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Debian-like required (apt).'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      rust-version:
        description: 'Rust toolchain channel or version (stable, beta, nightly, or a pinned version).'
        required: false
        type: string
        default: 'stable'
      features:
        description: 'Cargo feature flags passed to build/test (e.g. --all-features, --no-default-features).'
        required: false
        type: string
        default: '--all-features'
      apt-packages:
        description: 'Extra apt packages to install (space-separated).'
        required: false
        type: string
        default: ''
      deny:
        description: 'Run cargo-deny check. Requires deny.toml next to the Cargo.toml. Docker action; Linux runner only.'
        required: false
        type: boolean
        default: false
      deny-args:
        description: 'Arguments passed to cargo-deny before the check subcommand.'
        required: false
        type: string
        default: '--all-features'

permissions:
  contents: read

concurrency:
  group: qntx-workflows-ci-rust-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CARGO_TERM_COLOR: always
      FEATURES: ${{ inputs.features }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - uses: $/actions/apt-install
        with:
          packages: ${{ inputs.apt-packages }}

      - uses: $/actions/setup-rust
        with:
          rust-version: ${{ inputs.rust-version }}
          components: rustfmt, clippy

      - name: Record toolchain
        run: |
          set -euo pipefail
          {
            echo '## CI / Rust'
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- deny: ${{ inputs.deny }}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Deny
        if: ${{ inputs.deny }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ${{ inputs.deny-args }}
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          cargo clippy --workspace --all-targets $FEATURES -- -D warnings

      - name: Build
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          cargo build --workspace --verbose $FEATURES

      - name: Test
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          cargo test --workspace --verbose $FEATURES
