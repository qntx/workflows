name: CI / Rust

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Debian-like required (apt).'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      rust-version:
        description: 'Rust toolchain channel or version. Empty honours the working-directory rust-toolchain file, else stable.'
        required: false
        type: string
        default: ''
      features:
        description: 'Cargo feature flags: --all-features, --no-default-features, or --features <list>.'
        required: false
        type: string
        default: '--all-features'
      packages:
        description: 'Whitespace-separated package names. When set, clippy, build, test, and doc run once per package with -p (separate invocations prevent Cargo feature unification across workspace members). fmt and deny stay workspace-wide.'
        required: false
        type: string
        default: ''
      apt-packages:
        description: 'Extra apt packages to install (space-separated).'
        required: false
        type: string
        default: ''
      deny:
        description: 'Run cargo-deny check. Requires deny.toml next to the Cargo.toml. Docker action; Linux runner only.'
        required: false
        type: boolean
        default: false
      deny-args:
        description: 'Arguments passed to cargo-deny before the check subcommand.'
        required: false
        type: string
        default: '--all-features'
      doc:
        description: 'Run RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps after Test.'
        required: false
        type: boolean
        default: false
      package-check:
        description: 'Run cargo publish --workspace --dry-run --locked after Test.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CARGO_TERM_COLOR: always
      FEATURES: ${{ inputs.features }}
      DENY: ${{ inputs.deny }}
      DENY_ARGS: ${{ inputs.deny-args }}
      PACKAGES: ${{ inputs.packages }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - uses: $/actions/apt-install
        with:
          packages: ${{ inputs.apt-packages }}

      - uses: $/actions/setup-rust
        with:
          rust-version: ${{ inputs.rust-version }}
          working-directory: ${{ inputs.working-directory }}
          components: rustfmt, clippy

      - name: Record toolchain
        run: |
          set -euo pipefail
          {
            echo '## CI / Rust'
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- deny: ${DENY}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Check feature flags
        run: |
          set -euo pipefail
          case "$FEATURES" in
            --all-features | --no-default-features) ;;
            --features\ *)
              rest="${FEATURES#--features }"
              if ! [[ "$rest" =~ ^[A-Za-z0-9_,-]+$ ]]; then
                echo '::error::features list must match [A-Za-z0-9_,-]+'
                exit 1
              fi
              ;;
            *)
              echo '::error::features must be --all-features, --no-default-features, or --features <list>'
              exit 1
              ;;
          esac
          # word-split is intentional: whitespace-separated package names
          # shellcheck disable=SC2086
          for p in $PACKAGES; do
            if ! [[ "$p" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::packages entry charset: ${p}"
              exit 1
            fi
          done

      - name: Require Linux for cargo-deny
        if: ${{ inputs.deny }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" != Linux ]; then
            echo '::error::cargo-deny requires a Linux runner (Docker action)'
            exit 1
          fi
          if ! [[ "$DENY_ARGS" =~ ^[A-Za-z0-9_:,./[:space:]-]*$ ]]; then
            echo '::error::deny-args charset'
            exit 1
          fi

      - name: Deny
        if: ${{ inputs.deny }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ${{ inputs.deny-args }}
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          if [ -z "$PACKAGES" ]; then
            cargo clippy --workspace --all-targets $FEATURES -- -D warnings
          else
            for p in $PACKAGES; do
              cargo clippy -p "$p" --all-targets $FEATURES -- -D warnings
            done
          fi

      - name: Build
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          if [ -z "$PACKAGES" ]; then
            cargo build --workspace --verbose $FEATURES
          else
            for p in $PACKAGES; do
              cargo build -p "$p" --verbose $FEATURES
            done
          fi

      - name: Test
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          if [ -z "$PACKAGES" ]; then
            cargo test --workspace --verbose $FEATURES
          else
            for p in $PACKAGES; do
              cargo test -p "$p" --verbose $FEATURES
            done
          fi

      - name: Doc
        if: ${{ inputs.doc }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          if [ -z "$PACKAGES" ]; then
            cargo doc --workspace --no-deps $FEATURES
          else
            for p in $PACKAGES; do
              cargo doc -p "$p" --no-deps $FEATURES
            done
          fi

      - name: Package check
        if: ${{ inputs.package-check }}
        run: cargo publish --workspace --dry-run --locked
