name: CI / WASM

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Debian-like required (apt).'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      working-directory:
        description: 'Package directory for build:wasm, test:wasm, bench:wasm, and the dist check. Relative to the repository root.'
        required: false
        type: string
        default: '.'
      install-directory:
        description: 'Directory for bun install --frozen-lockfile or npm ci. Relative to the repository root.'
        required: false
        type: string
        default: '.'
      cargo-directory:
        description: 'Cargo workspace for fmt, clippy, test, and Cargo.lock. Relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      package-manager:
        description: 'bun or npm. Not auto-detected. pnpm and yarn fail inside setup-wasm before apt.'
        required: false
        type: string
        default: 'bun'
      bun-version:
        description: 'Bun version when package-manager is bun. Not latest.'
        required: false
        type: string
        default: '1.4'
      node-version:
        description: 'Node.js when package-manager is npm. Not installed on the bun path. This job does not publish.'
        required: false
        type: string
        default: '24'
      bench:
        description: 'Run bench:wasm after test:wasm.'
        required: false
        type: boolean
        default: false
      targets:
        description: 'Full rustup --target list passed to the pinned dtolnay action. Not merged with rust-toolchain.toml.'
        required: false
        type: string
        default: 'wasm32-unknown-unknown'
      apt-packages:
        description: 'Apt packages for the wasm C toolchain. Passed through apt-install.'
        required: false
        type: string
        default: 'clang lld llvm'

permissions:
  contents: read

concurrency:
  group: qntx-workflows-ci-wasm-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - uses: $/actions/setup-wasm
        with:
          toolchain: true
          dist-check: false
          apt-packages: ${{ inputs.apt-packages }}
          cargo-directory: ${{ inputs.cargo-directory }}
          package-directory: ${{ inputs.working-directory }}
          install-directory: ${{ inputs.install-directory }}
          package-manager: ${{ inputs.package-manager }}
          targets: ${{ inputs.targets }}
          cache-key: wasm32

      - name: Format
        working-directory: ${{ inputs.cargo-directory }}
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: ${{ inputs.cargo-directory }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: ${{ inputs.cargo-directory }}
        run: cargo test --workspace

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        if: ${{ inputs.package-manager == 'npm' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.install-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac

      - name: Build wasm
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun) bun run build:wasm ;;
            npm) npm run build:wasm ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac

      - uses: $/actions/setup-wasm
        with:
          toolchain: false
          dist-check: true
          package-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}

      - name: Test wasm
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun) bun run test:wasm ;;
            npm) npm run test:wasm ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac

      - name: Bench wasm
        if: ${{ inputs.bench }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun) bun run bench:wasm ;;
            npm) npm run bench:wasm ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac
