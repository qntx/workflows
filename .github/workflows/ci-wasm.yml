name: CI / WASM

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Debian-like required (apt).'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      working-directory:
        description: 'Package directory for build:wasm, test:wasm, bench:wasm, and the dist check. Relative to the repository root.'
        required: false
        type: string
        default: '.'
      install-directory:
        description: 'Directory for bun install --frozen-lockfile or npm ci. Relative to the repository root.'
        required: false
        type: string
        default: '.'
      language:
        description: 'Toolchain language: rust (Rust cdylib built by cargo) or c (clang only; cargo-directory and targets are ignored and rust-checks must be false).'
        required: false
        type: string
        default: 'rust'
      cargo-directory:
        description: 'Cargo workspace for fmt, clippy, test, and Cargo.lock. Relative to the repository root. Ignored when language is c.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      package-manager:
        description: 'bun or npm. Not auto-detected. pnpm and yarn fail inside setup-wasm before apt.'
        required: false
        type: string
        default: 'bun'
      bun-version:
        description: 'Bun version when package-manager is bun. Not latest.'
        required: false
        type: string
        default: '1.4'
      node-version:
        description: 'Node.js when package-manager is npm. Not installed on the bun path. This job does not publish.'
        required: false
        type: string
        default: '24'
      bench:
        description: 'Run bench:wasm after test:wasm.'
        required: false
        type: boolean
        default: false
      rust-checks:
        description: 'Run cargo fmt, clippy, and test on the cargo workspace. Disable when a sibling ci-rust job covers them. Must be false when language is c.'
        required: false
        type: boolean
        default: true
      scripts:
        description: 'Whitespace-separated package script names run in order after test:wasm/bench:wasm.'
        required: false
        type: string
        default: ''
      scripts-directory:
        description: 'Directory for the Extra scripts step. Empty runs them in working-directory. Relative to the repository root.'
        required: false
        type: string
        default: ''
      dist-export:
        description: 'Package exports key for the wasm dist check.'
        required: false
        type: string
        default: './wasm'
      targets:
        description: 'Full rustup --target list passed to the pinned dtolnay action. Not merged with rust-toolchain.toml. Ignored when language is c.'
        required: false
        type: string
        default: 'wasm32-unknown-unknown'
      apt-packages:
        description: 'Apt packages for the wasm C toolchain. Passed through apt-install.'
        required: false
        type: string
        default: 'clang lld llvm'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Reject rust-checks in C mode
        if: ${{ inputs.language == 'c' && inputs.rust-checks }}
        shell: bash
        run: |
          set -euo pipefail
          echo '::error::ci-wasm: rust-checks must be false when language is c'
          exit 1

      - uses: $/actions/setup-wasm
        with:
          toolchain: true
          dist-check: false
          language: ${{ inputs.language }}
          apt-packages: ${{ inputs.apt-packages }}
          cargo-directory: ${{ inputs.cargo-directory }}
          package-directory: ${{ inputs.working-directory }}
          install-directory: ${{ inputs.install-directory }}
          package-manager: ${{ inputs.package-manager }}
          targets: ${{ inputs.targets }}
          dist-export: ${{ inputs.dist-export }}
          cache-key: wasm32

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        if: ${{ inputs.package-manager == 'npm' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Last setup step: a success outcome here means the whole setup chain
      # ran clean, so the gates below key off steps.install.
      - name: Install dependencies
        id: install
        working-directory: ${{ inputs.install-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac

      - name: Format
        id: fmt
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.rust-checks }}
        working-directory: ${{ inputs.cargo-directory }}
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.rust-checks }}
        working-directory: ${{ inputs.cargo-directory }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.rust-checks }}
        working-directory: ${{ inputs.cargo-directory }}
        run: cargo test --workspace

      - name: Build wasm
        id: build-wasm
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: '"$PM" run build:wasm'

      # The wasm chain is dependent: each step consumes the previous output.
      - name: Check wasm dist
        id: dist-check
        if: ${{ !cancelled() && steps.build-wasm.outcome == 'success' }}
        uses: $/actions/setup-wasm
        with:
          toolchain: false
          dist-check: true
          language: ${{ inputs.language }}
          package-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          dist-export: ${{ inputs.dist-export }}

      - name: Test wasm
        id: test-wasm
        if: ${{ !cancelled() && steps.dist-check.outcome == 'success' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: '"$PM" run test:wasm'

      - name: Bench wasm
        id: bench
        if: ${{ !cancelled() && steps.dist-check.outcome == 'success' && inputs.bench }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: '"$PM" run bench:wasm'

      - name: Extra scripts
        id: scripts
        if: ${{ !cancelled() && steps.build-wasm.outcome == 'success' && inputs.scripts != '' }}
        working-directory: ${{ inputs.scripts-directory != '' && inputs.scripts-directory || inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          # word-split is intentional: whitespace-separated script names
          # shellcheck disable=SC2086
          for s in $SCRIPTS; do
            if ! [[ "$s" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "::error::scripts entry charset: ${s}"
              exit 1
            fi
            "$PM" run "$s"
          done

      # Verdict step: runs even when a gate failed so the summary table and
      # the failure annotation are always produced. Not on cancellation.
      - name: Gates
        id: gates
        if: ${{ !cancelled() }}
        env:
          SETUP: ${{ steps.install.outcome }}
          R_FMT: ${{ steps.fmt.outcome }}
          R_CLIPPY: ${{ steps.clippy.outcome }}
          R_TEST: ${{ steps.test.outcome }}
          R_BUILD_WASM: ${{ steps.build-wasm.outcome }}
          R_DIST: ${{ steps.dist-check.outcome }}
          R_TEST_WASM: ${{ steps.test-wasm.outcome }}
          R_BENCH: ${{ steps.bench.outcome }}
          R_SCRIPTS: ${{ steps.scripts.outcome }}
        run: |
          set -euo pipefail
          verdict() {
            local failure=0 success=0 skipped=0 o
            for o in "$@"; do
              case "$o" in
                failure | cancelled) failure=1 ;;
                success) success=1 ;;
                skipped) skipped=1 ;;
              esac
            done
            if ((failure)); then
              echo '**fail**'
            elif ((success)); then
              echo 'pass'
            elif ((skipped)); then
              echo 'skip'
            else
              echo 'not run'
            fi
          }
          names=() results=() failed=()
          emit() {
            local name="$1" v
            shift
            v="$(verdict "$@")"
            names+=("$name")
            results+=("$v")
            if [[ "$v" == '**fail**' ]]; then
              failed+=("$name")
            fi
          }
          emit fmt "$R_FMT"
          emit clippy "$R_CLIPPY"
          emit test "$R_TEST"
          emit build:wasm "$R_BUILD_WASM"
          emit dist "$R_DIST"
          emit test:wasm "$R_TEST_WASM"
          emit bench:wasm "$R_BENCH"
          emit scripts "$R_SCRIPTS"
          {
            echo '## CI / WASM gates'
            echo
            if [[ "$SETUP" != success ]]; then
              echo "Setup failed before the gates ran (install: ${SETUP:-not run})."
              echo
            fi
            echo '| Gate | Result |'
            echo '| ---- | ------ |'
            for i in "${!names[@]}"; do
              echo "| ${names[$i]} | ${results[$i]} |"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          if ((${#failed[@]})); then
            printf -v list '%s, ' "${failed[@]}"
            echo "::error title=CI / WASM::failed gates: ${list%, }"
            exit 1
          fi
