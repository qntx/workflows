name: Deploy / MkDocs

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      python-version:
        description: 'Python version to use.'
        required: false
        type: string
        default: '3.13'
      requirements-file:
        description: 'Path to a requirements.txt file. Used when present; otherwise mkdocs-dependencies is installed directly.'
        required: false
        type: string
        default: 'requirements.txt'
      mkdocs-dependencies:
        description: 'Space-separated package list installed when requirements-file is absent.'
        required: false
        type: string
        default: 'mkdocs-material mkdocstrings mkdocstrings-python mkdocs-minify-plugin'

permissions:
  contents: write

concurrency:
  group: qntx-workflows-deploy-mkdocs-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps:
      - uses: $/actions/hardened-checkout
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Install MkDocs dependencies
        env:
          REQ: ${{ inputs.requirements-file }}
          PKGS: ${{ inputs.mkdocs-dependencies }}
        run: |
          set -euo pipefail
          if [ -f "$REQ" ]; then
            uv pip install --system -r "$REQ"
          else
            # word-split is intentional; -- stops option injection
            # shellcheck disable=SC2086
            uv pip install --system -- $PKGS
          fi

      - name: Deploy documentation
        run: mkdocs gh-deploy --force
