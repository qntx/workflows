name: Ops / Dependabot

# Caller owns on: (schedule / workflow_dispatch). Do not checkout the PR.
# Does not approve. Required reviews are skip:BLOCKED; this workflow never
# merges those PRs.

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'GitHub merge method: squash, merge, or rebase.'
        required: false
        type: string
        default: 'squash'
      allow-patch:
        description: 'Auto-merge version-update:semver-patch and version-update:lockfile-only.'
        required: false
        type: boolean
        default: true
      allow-minor:
        description: 'Auto-merge version-update:semver-minor.'
        required: false
        type: boolean
        default: true
      allow-major:
        description: 'Auto-merge version-update:semver-major. Default false.'
        required: false
        type: boolean
        default: false
      exempt-labels:
        description: 'Comma-separated labels that skip auto-merge.'
        required: false
        type: string
        default: 'do-not-merge,work-in-progress'
    secrets:
      TOKEN:
        description: 'Token for gh. Omit to use github.token. Use a PAT only if GITHUB_TOKEN cannot merge.'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qntx-workflows-ops-dependabot-${{ github.repository }}-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: $/actions/ops-dependabot-enable
        with:
          github-token: ${{ secrets.TOKEN || github.token }}
          merge-method: ${{ inputs.merge-method }}
          allow-patch: ${{ inputs.allow-patch }}
          allow-minor: ${{ inputs.allow-minor }}
          allow-major: ${{ inputs.allow-major }}
          exempt-labels: ${{ inputs.exempt-labels }}
