name: Release / Rust

on:
  workflow_call:
    inputs:
      bin:
        description: 'Binary name for the CLI executable (e.g. machi, xmtp).'
        required: true
        type: string
      package:
        description: 'Cargo package name to build (passed to cargo build -p).'
        required: true
        type: string
      targets:
        description: 'Whitespace-separated subset of the supported triples: the five defaults (x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc) plus two opt-in musl triples (x86_64-unknown-linux-musl, aarch64-unknown-linux-musl).'
        required: false
        type: string
        default: 'x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc'
      artifact-prefix:
        description: 'upload-artifact name prefix; each build uploads <prefix>-<target>. Change it when one run calls this workflow for the same target more than once.'
        required: false
        type: string
        default: 'dist'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      cross-packages:
        description: 'Whitespace-separated apt packages for ARM64 cross-compilation.'
        required: false
        type: string
        default: 'gcc-aarch64-linux-gnu'
      cross-env:
        description: 'Newline-separated KEY=VALUE env vars applied during cross-compilation.'
        required: false
        type: string
        default: ''
      cargo-env:
        description: 'Newline-separated KEY=VALUE global cargo/build env vars.'
        required: false
        type: string
        default: ''
      rust-version:
        description: 'Rust toolchain. Empty honours the working-directory rust-toolchain file, else stable.'
        required: false
        type: string
        default: ''
    outputs:
      release-url:
        description: 'URL of the created GitHub Release.'
        value: ${{ jobs.release.outputs.release-url }}
      tag-name:
        description: 'Tag name of the release.'
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  contents: write

concurrency:
  group: qntx-workflows-release-rust-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          entries=()
          seen=' '
          # word-split is intentional: whitespace-separated triples
          # shellcheck disable=SC2086
          for t in $TARGETS; do
            case "$t" in
              x86_64-unknown-linux-gnu) os='ubuntu-24.04'; cross=false; musl=false ;;
              aarch64-unknown-linux-gnu) os='ubuntu-24.04'; cross=true; musl=false ;;
              x86_64-unknown-linux-musl) os='ubuntu-24.04'; cross=false; musl=true ;;
              aarch64-unknown-linux-musl) os='ubuntu-24.04-arm'; cross=false; musl=true ;;
              aarch64-apple-darwin) os='macos-latest'; cross=false; musl=false ;;
              x86_64-pc-windows-msvc | aarch64-pc-windows-msvc) os='windows-latest'; cross=false; musl=false ;;
              *)
                echo "::error::unsupported target triple: ${t}"
                exit 1
                ;;
            esac
            case "$seen" in
              *" $t "*)
                echo "::error::duplicate target: ${t}"
                exit 1
                ;;
            esac
            seen+="$t "
            entries+=("$(jq -cn --arg target "$t" --arg os "$os" --argjson cross "$cross" --argjson musl "$musl" \
              '{target: $target, os: $os} + (if $cross then {cross: true} else {} end) + (if $musl then {musl: true} else {} end)')")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo '::error::targets is empty'
            exit 1
          fi
          matrix="$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - uses: $/actions/setup-rust
        with:
          rust-version: ${{ inputs.rust-version }}
          working-directory: ${{ inputs.working-directory }}
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Apply cargo-env
        uses: $/actions/parse-env-block
        with:
          block: ${{ inputs.cargo-env }}

      - name: Setup ARM64 apt sources
        if: matrix.cross
        run: |
          set -euo pipefail
          # GitHub ubuntu-latest / ubuntu-24.04 (and 26.04 preview) use deb822
          # /etc/apt/sources.list.d/ubuntu.sources. If that path changes, fail closed.
          . /etc/os-release
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports/' \
            "Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security" \
            'Components: main restricted universe multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64-cross.sources
          sudo dpkg --add-architecture arm64

      - name: Install cross packages
        if: matrix.cross
        uses: $/actions/apt-install
        with:
          packages: ${{ inputs.cross-packages }}

      - name: Apply cross linker and cross-env
        if: matrix.cross
        uses: $/actions/parse-env-block
        with:
          block: |
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            ${{ inputs.cross-env }}

      - name: Install musl tools
        if: matrix.musl
        uses: $/actions/apt-install
        with:
          packages: musl-tools

      - name: Apply musl CC
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: printf 'CC_%s=musl-gcc\n' "${TARGET//-/_}" >>"$GITHUB_ENV"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ inputs.package }}
        run: cargo build --release --locked --target "$TARGET" -p "$PACKAGE"

      - name: Package
        working-directory: ${{ inputs.working-directory }}
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="$BIN"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver='0.0.0-dev'
          fi
          target="$TARGET"
          staging="$bin-$ver-$target"
          exe="$bin"
          [[ "$target" == *windows* ]] && exe="$exe.exe"

          mkdir -p dist "$staging"
          cp "target/$target/release/$exe" "$staging/"
          # Copy any LICENSE* and README* files that exist (tolerant to single-license projects).
          shopt -s nullglob
          for f in LICENSE* README*; do cp "$f" "$staging/"; done
          shopt -u nullglob

          if [[ "$target" == *windows* ]]; then
            (cd "$staging" && 7z a "../dist/$staging.zip" .)
            asset="dist/$staging.zip"
          else
            tar czf "dist/$staging.tar.gz" -C "$staging" .
            asset="dist/$staging.tar.gz"
          fi

          # Canonical GNU text format with the bare asset name so consumers can run
          # `sha256sum -c <name>.sha256` in the download directory. Verification is
          # fail-closed: a checksum that does not verify breaks the release build.
          name="$(basename "$asset")"
          if command -v sha256sum &>/dev/null; then
            hash="$(sha256sum "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$name" >"dist/$name.sha256"
            (cd dist && sha256sum -c "$name.sha256")
          else
            hash="$(shasum -a 256 "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$name" >"dist/$name.sha256"
            (cd dist && shasum -a 256 -c "$name.sha256")
          fi

          rm -rf "$staging"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          path: ${{ inputs.working-directory }}/dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.publish.outputs.url }}
      tag-name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "name=${REF#refs/tags/}" >>"$GITHUB_OUTPUT"

      - name: Resolve prerelease flag
        id: pre
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ -(alpha|beta|rc|preview|pre|dev|nightly)($|[.0-9-]) ]]; then
            echo 'flag=true' >>"$GITHUB_OUTPUT"
          else
            echo 'flag=false' >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Resolve asset globs
        id: assets
        env:
          BIN: ${{ inputs.bin }}
        run: |
          set -euo pipefail
          {
            echo 'files<<EOF'
            printf '%s\n' "${BIN}-*.tar.gz" "${BIN}-*.zip" "${BIN}-*.sha256"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header

      # A draft for the tag is fine: action-gh-release finds it via its
      # listReleases fallback (getReleaseByTag 404s on drafts) and updates it.
      # An already-published release must not be mutated — with GitHub
      # immutable releases asset uploads would fail anyway, so fail closed.
      - name: Guard against an existing published release
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" \
            && [[ "$state" == 'false' ]]; then
            echo "::error::release for tag ${TAG} is already published; refusing to mutate it"
            exit 1
          fi

      # Draft-first: upload every asset while the release is still a draft,
      # then publish. Required for GitHub immutable releases (assets are
      # locked at publish) and recommended for all releases so "Latest"
      # never points at a release whose assets are still uploading.
      - name: Create draft GitHub Release
        id: gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.cliff.outputs.content }}
          files: ${{ steps.assets.outputs.files }}
          prerelease: ${{ steps.pre.outputs.flag }}
          draft: true

      - name: Publish release
        id: publish
        env:
          TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE: ${{ steps.pre.outputs.flag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=true
          [[ "$PRERELEASE" == 'true' ]] && latest=false
          gh release edit "$TAG" --draft=false "--latest=$latest"
          url="$(gh release view "$TAG" --json url -q .url)"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Summarize
        env:
          URL: ${{ steps.publish.outputs.url }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "Released ${TAG}: ${URL}" >>"$GITHUB_STEP_SUMMARY"
