name: Release / Rust

on:
  workflow_call:
    inputs:
      bin:
        description: 'Binary name for the CLI executable (e.g. machi, xmtp).'
        required: true
        type: string
      package:
        description: 'Cargo package name to build (passed to cargo build -p).'
        required: true
        type: string
      cross-packages:
        description: 'Whitespace-separated apt packages for ARM64 cross-compilation.'
        required: false
        type: string
        default: 'gcc-aarch64-linux-gnu'
      cross-env:
        description: 'Newline-separated KEY=VALUE env vars applied during cross-compilation.'
        required: false
        type: string
        default: ''
      cargo-env:
        description: 'Newline-separated KEY=VALUE global cargo/build env vars.'
        required: false
        type: string
        default: ''
      rust-version:
        description: 'Rust toolchain (stable, beta, nightly, or a pinned version).'
        required: false
        type: string
        default: 'stable'
    outputs:
      release-url:
        description: 'URL of the created GitHub Release.'
        value: ${{ jobs.release.outputs.release-url }}
      tag-name:
        description: 'Tag name of the release.'
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  contents: write

concurrency:
  group: qntx-workflows-release-rust-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - uses: $/actions/setup-rust
        with:
          rust-version: ${{ inputs.rust-version }}
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Apply cargo-env
        uses: $/actions/parse-env-block
        with:
          block: ${{ inputs.cargo-env }}

      - name: Setup ARM64 apt sources
        if: matrix.cross
        run: |
          set -euo pipefail
          # noble default sources are amd64-only; arm64 debs come from ubuntu-ports.
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports/' \
            'Suites: noble noble-updates noble-security' \
            'Components: main restricted universe multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64-cross.sources
          sudo dpkg --add-architecture arm64

      - name: Install cross packages
        if: matrix.cross
        uses: $/actions/apt-install
        with:
          packages: ${{ inputs.cross-packages }}

      - name: Apply cross linker and cross-env
        if: matrix.cross
        uses: $/actions/parse-env-block
        with:
          block: |
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            ${{ inputs.cross-env }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ inputs.package }}
        run: cargo build --release --locked --target "$TARGET" -p "$PACKAGE"

      - name: Package
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="$BIN"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver='0.0.0-dev'
          fi
          target="$TARGET"
          staging="$bin-$ver-$target"
          exe="$bin"
          [[ "$target" == *windows* ]] && exe="$exe.exe"

          mkdir -p dist "$staging"
          cp "target/$target/release/$exe" "$staging/"
          # Copy any LICENSE* and README* files that exist (tolerant to single-license projects).
          shopt -s nullglob
          for f in LICENSE* README*; do cp "$f" "$staging/"; done
          shopt -u nullglob

          if [[ "$target" == *windows* ]]; then
            (cd "$staging" && 7z a "../dist/$staging.zip" .)
            asset="dist/$staging.zip"
          else
            tar czf "dist/$staging.tar.gz" -C "$staging" .
            asset="dist/$staging.tar.gz"
          fi

          if command -v sha256sum &>/dev/null; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi

          rm -rf "$staging"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.gh-release.outputs.url }}
      tag-name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "name=${REF#refs/tags/}" >>"$GITHUB_OUTPUT"

      - name: Resolve prerelease flag
        id: pre
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ (alpha|beta|rc|pre|preview|dev|nightly) ]]; then
            echo 'flag=true' >>"$GITHUB_OUTPUT"
          else
            echo 'flag=false' >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Resolve asset globs
        id: assets
        env:
          BIN: ${{ inputs.bin }}
        run: |
          set -euo pipefail
          {
            echo 'files<<EOF'
            printf '%s\n' "${BIN}-*.tar.gz" "${BIN}-*.zip" "${BIN}-*.sha256"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          args: --latest --strip header

      - name: Create GitHub Release
        id: gh-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.cliff.outputs.content }}
          files: ${{ steps.assets.outputs.files }}
          prerelease: ${{ steps.pre.outputs.flag }}
          make_latest: ${{ steps.pre.outputs.flag == 'false' && 'true' || 'false' }}

      - name: Summarize
        env:
          URL: ${{ steps.gh-release.outputs.url }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "Released ${TAG}: ${URL}" >>"$GITHUB_STEP_SUMMARY"
