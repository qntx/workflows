name: Release / Rust

on:
  workflow_call:
    inputs:
      bin:
        description: 'Binary name for the CLI executable (e.g. machi, xmtp).'
        required: true
        type: string
      package:
        description: 'Cargo package name to build (passed to cargo build -p).'
        required: true
        type: string
      targets:
        description: 'Whitespace-separated subset of the supported triples: the five defaults (x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc) plus two opt-in musl triples (x86_64-unknown-linux-musl, aarch64-unknown-linux-musl).'
        required: false
        type: string
        default: 'x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc'
      artifact-prefix:
        description: 'upload-artifact name prefix; each build uploads <prefix>-<target>. Change it when one run calls this workflow for the same target more than once.'
        required: false
        type: string
        default: 'dist'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      cross-packages:
        description: 'Whitespace-separated apt packages for ARM64 cross-compilation.'
        required: false
        type: string
        default: 'gcc-aarch64-linux-gnu'
      cross-env:
        description: 'Newline-separated KEY=VALUE env vars applied during cross-compilation.'
        required: false
        type: string
        default: ''
      cargo-env:
        description: 'Newline-separated KEY=VALUE global cargo/build env vars.'
        required: false
        type: string
        default: ''
      rust-version:
        description: 'Rust toolchain. Empty honours the working-directory rust-toolchain file, else stable.'
        required: false
        type: string
        default: ''
      variants:
        description: 'Newline-separated name=<cargo feature flags> variant builds, each built for every target in addition to the default build. name matches ^[a-z][a-z0-9]*$ and must be unique; flags are one of: --all-features, --no-default-features, --features <list>, --no-default-features --features <list>.'
        required: false
        type: string
        default: ''
      sbom:
        description: 'Generate a CycloneDX JSON SBOM per archive named <bin>-<version>[-<variant>]-<target>.cdx.json.'
        required: false
        type: boolean
        default: false
      checksums-file:
        description: 'Publish an aggregate SHA256SUMS asset covering every archive.'
        required: false
        type: boolean
        default: false
      smoke-command:
        description: 'Whitespace-separated arguments run against every built binary before the release (e.g. --version). A non-zero exit blocks the release.'
        required: false
        type: string
        default: ''
      glibc-floor:
        description: 'Newest glibc symbol version (MAJOR.MINOR, e.g. 2.31) the *-unknown-linux-gnu binaries may require. Empty keeps the native ubuntu-24.04 build (glibc 2.39). When set, both gnu targets build with cargo-zigbuild for <triple>.<floor> instead of the apt cross toolchain, and the build fails if a binary requires a newer GLIBC_x.y. cross-packages must stay at its default; cross-env still applies to aarch64-unknown-linux-gnu.'
        required: false
        type: string
        default: ''
    outputs:
      release-url:
        description: 'URL of the created GitHub Release.'
        value: ${{ jobs.release.outputs.release-url }}
      tag-name:
        description: 'Tag name of the release.'
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  contents: write

# artifact-prefix separates calls in one run: a shared group holds one
# running and one pending call, so a third call would be cancelled.
concurrency:
  group: qntx-workflows-release-rust-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.artifact-prefix }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # glibc-floor toolchain: zig 0.17.1 (released 2026-11-02), cargo-zigbuild
  # 0.24.1 (released 2026-11-04). No CARGO_ prefix: rust-cache hashes CARGO*
  # env vars into its cache key, so a CARGO_* name would invalidate every
  # caller's cache.
  ZIG_VERSION: '0.17.1'
  # ZIG_WHEEL_SHA256: ziglang-0.17.1 manylinux x86_64 wheel (uploaded to PyPI
  # 2026-11-05); ZIG_SHA256: zig-x86_64-linux-0.17.1.tar.xz.
  ZIG_WHEEL_SHA256: 'ea6cc5d87b033cf0aedfbc8f9549a908cae6c50ac31f1698188fa48a74524b54'
  ZIG_SHA256: '3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a'
  ZIGBUILD_VERSION: '0.24.1'
  ZIGBUILD_SHA256: 'f09b180a517af0e4dd4bffc921bb88e5ab705452a9dd948c61e489b3020c68c2'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          VARIANTS: ${{ inputs.variants }}
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
          GLIBC_FLOOR: ${{ inputs.glibc-floor }}
          CROSS_PACKAGES: ${{ inputs.cross-packages }}
        run: |
          set -euo pipefail

          # Index 0 is the default build (empty variant/features); each
          # `name=<flags>` line of `variants` appends one entry.
          variant_names=('')
          variant_flags=('')
          seen_variants=' '
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" ]] && continue
            if [[ "$line" != *=* ]]; then
              echo "::error::variant is not name=<flags>: ${line}"
              exit 1
            fi
            vname="${line%%=*}"
            vflags="${line#*=}"
            if [[ ! "$vname" =~ ^[a-z][a-z0-9]*$ ]]; then
              echo "::error::invalid variant name: ${vname}"
              exit 1
            fi
            case "$seen_variants" in
              *" $vname "*)
                echo "::error::duplicate variant: ${vname}"
                exit 1
                ;;
            esac
            seen_variants+="$vname "
            case "$vflags" in
              '--all-features' | '--no-default-features') ;;
              --features\ * | --no-default-features\ --features\ *)
                vlist="${vflags##*--features }"
                if [[ ! "$vlist" =~ ^[A-Za-z0-9_,-]+$ ]]; then
                  echo "::error::invalid feature list in variant ${vname}: ${vflags}"
                  exit 1
                fi
                ;;
              *)
                echo "::error::invalid feature flags in variant ${vname}: ${vflags}"
                exit 1
                ;;
            esac
            variant_names+=("$vname")
            variant_flags+=("$vflags")
          done <<<"$VARIANTS"

          if [[ -n "${SMOKE_COMMAND//[[:space:]]/}" ]]; then
            # word-split is intentional: whitespace-separated arguments
            # shellcheck disable=SC2086
            for arg in $SMOKE_COMMAND; do
              if [[ ! "$arg" =~ ^[A-Za-z0-9_./:=,+@-]+$ ]]; then
                echo "::error::invalid smoke-command argument: ${arg}"
                exit 1
              fi
            done
          fi

          # glibc-floor must be a glibc 2.x version Rust supports and is not
          # combined with the apt cross toolchain (those arm64 packages are
          # built for Ubuntu 24.04's glibc 2.39).
          gnu_seen=false
          if [[ -n "$GLIBC_FLOOR" ]]; then
            if [[ ! "$GLIBC_FLOOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::invalid glibc-floor: ${GLIBC_FLOOR} (expected MAJOR.MINOR, e.g. 2.31)"
              exit 1
            fi
            if [[ "${GLIBC_FLOOR%%.*}" -ne 2 || "${GLIBC_FLOOR##*.}" -lt 17 ]]; then
              echo "::error::unsupported glibc-floor: ${GLIBC_FLOOR} (expected 2.17 or newer within glibc 2.x; 2.17 is the oldest glibc Rust supports)"
              exit 1
            fi
            if [[ "$CROSS_PACKAGES" != 'gcc-aarch64-linux-gnu' ]]; then
              echo "::error::cross-packages is not used under glibc-floor: apt arm64 packages are built against Ubuntu 24.04's glibc 2.39 and cannot be linked under a lower floor; leave cross-packages at its default and vendor C dependencies instead"
              exit 1
            fi
          fi

          entries=()
          seen=' '
          # word-split is intentional: whitespace-separated triples
          # shellcheck disable=SC2086
          for t in $TARGETS; do
            case "$t" in
              x86_64-unknown-linux-gnu) os='ubuntu-24.04'; cross=false; musl=false; smoke_os='ubuntu-24.04' ;;
              aarch64-unknown-linux-gnu) os='ubuntu-24.04'; cross=true; musl=false; smoke_os='ubuntu-24.04-arm' ;;
              x86_64-unknown-linux-musl) os='ubuntu-24.04'; cross=false; musl=true; smoke_os='ubuntu-24.04' ;;
              aarch64-unknown-linux-musl) os='ubuntu-24.04-arm'; cross=false; musl=true; smoke_os='ubuntu-24.04-arm' ;;
              aarch64-apple-darwin) os='macos-latest'; cross=false; musl=false; smoke_os='macos-latest' ;;
              x86_64-pc-windows-msvc | aarch64-pc-windows-msvc) os='windows-latest'; cross=false; musl=false; smoke_os='windows-latest' ;;
              *)
                echo "::error::unsupported target triple: ${t}"
                exit 1
                ;;
            esac
            # The x86_64/aarch64 windows builds share one case arm; the arm64
            # smoke runner is separate because windows-latest cannot execute
            # cross-built aarch64 binaries.
            if [[ "$t" == 'aarch64-pc-windows-msvc' ]]; then
              smoke_os='windows-11-arm'
            fi
            zig=false
            if [[ -n "$GLIBC_FLOOR" && "$t" == *-unknown-linux-gnu ]]; then
              zig=true
              cross=false
              gnu_seen=true
            fi
            case "$seen" in
              *" $t "*)
                echo "::error::duplicate target: ${t}"
                exit 1
                ;;
            esac
            seen+="$t "
            for i in "${!variant_names[@]}"; do
              entries+=("$(jq -cn --arg target "$t" --arg os "$os" --arg smoke_os "$smoke_os" \
                --arg variant "${variant_names[$i]}" --arg features "${variant_flags[$i]}" \
                --argjson cross "$cross" --argjson musl "$musl" --argjson zig "$zig" \
                '{target: $target, os: $os, smoke_os: $smoke_os, variant: $variant, features: $features} + (if $cross then {cross: true} else {} end) + (if $musl then {musl: true} else {} end) + (if $zig then {zig: true} else {} end)')")
            done
          done
          if [[ -n "$GLIBC_FLOOR" && "$gnu_seen" != true ]]; then
            echo '::error::glibc-floor is set but targets has no *-unknown-linux-gnu triple'
            exit 1
          fi
          if [ "${#entries[@]}" -eq 0 ]; then
            echo '::error::targets is empty'
            exit 1
          fi
          matrix="$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.variant != '' && format('{0} ', matrix.variant) || '' }}${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # cargo-cyclonedx 0.5.10 (released 2026-11-10)
      CARGO_CYCLONEDX_VERSION: '0.5.10'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - uses: $/actions/setup-rust
        with:
          rust-version: ${{ inputs.rust-version }}
          working-directory: ${{ inputs.working-directory }}
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}${{ matrix.zig && format('-glibc{0}', inputs.glibc-floor) || '' }}

      - name: Apply cargo-env
        uses: $/actions/parse-env-block
        with:
          block: ${{ inputs.cargo-env }}

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [[ "$(uname -sm)" != 'Linux x86_64' ]]; then
            echo "::error::glibc-floor builds need a Linux x86_64 runner, got $(uname -sm)"
            exit 1
          fi
          tools="$RUNNER_TEMP/glibc-floor-tools"
          mkdir -p "$tools/zig" "$tools/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          # zig comes from the official ziglang PyPI wheel
          # (codeberg.org/ziglang/zig-pypi) on PyPI's CDN, falling back to the
          # ziglang.org tarball via its Fastly mirror: ziglang.org throttles
          # CI downloads. Each source is pinned by its own sha256.
          zig_ok=false
          if curl -fsSL --retry 2 --max-time 180 -o zig.whl \
            "https://files.pythonhosted.org/packages/py3/z/ziglang/ziglang-${ZIG_VERSION}-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl" \
            && echo "${ZIG_WHEEL_SHA256}  zig.whl" | sha256sum -c; then
            unzip -q zig.whl 'ziglang/*'
            cp -a ziglang/. "$tools/zig/"
            zig_ok=true
          else
            echo '::warning::zig wheel download failed or did not verify; trying the tarball'
            if curl -fsSL --retry 2 --max-time 240 -o zig.tar.xz \
              "https://ziglang.freetls.fastly.net/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
              && echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c; then
              tar -xJf zig.tar.xz --strip-components=1 -C "$tools/zig"
              zig_ok=true
            fi
          fi
          if [[ "$zig_ok" != true ]]; then
            echo "::error::could not download a verified zig ${ZIG_VERSION}"
            exit 1
          fi
          curl -fsSL --retry 3 --max-time 240 -o cargo-zigbuild.tar.xz \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${ZIGBUILD_VERSION}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "${ZIGBUILD_SHA256}  cargo-zigbuild.tar.xz" | sha256sum -c
          tar -xJf cargo-zigbuild.tar.xz
          install -m 0755 cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild "$tools/bin/"
          echo "$tools/zig" >>"$GITHUB_PATH"
          echo "$tools/bin" >>"$GITHUB_PATH"
          "$tools/zig/zig" version
          "$tools/bin/cargo-zigbuild" --version

      - name: Setup ARM64 apt sources
        if: matrix.cross
        run: |
          set -euo pipefail
          # GitHub ubuntu-latest / ubuntu-24.04 (and 26.04 preview) use deb822
          # /etc/apt/sources.list.d/ubuntu.sources. If that path changes, fail closed.
          . /etc/os-release
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports/' \
            "Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security" \
            'Components: main restricted universe multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64-cross.sources
          sudo dpkg --add-architecture arm64

      - name: Install cross packages
        if: matrix.cross
        uses: $/actions/apt-install
        with:
          packages: ${{ inputs.cross-packages }}

      - name: Apply cross linker and cross-env
        if: matrix.cross
        uses: $/actions/parse-env-block
        with:
          block: |
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            ${{ inputs.cross-env }}

      # Under glibc-floor the gnu targets have no `cross` key, so the apt
      # cross steps above skip. cross-env still applies to the zig aarch64
      # build — but the linker line must not: cargo-zigbuild only sets
      # CARGO_TARGET_<T>_LINKER/CC_<target> when they are missing, so a
      # pre-set linker would bypass zig.
      - name: Apply cross-env
        if: matrix.zig && matrix.target == 'aarch64-unknown-linux-gnu'
        uses: $/actions/parse-env-block
        with:
          block: ${{ inputs.cross-env }}

      - name: Install musl tools
        if: matrix.musl
        uses: $/actions/apt-install
        with:
          packages: musl-tools

      - name: Apply musl CC
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: printf 'CC_%s=musl-gcc\n' "${TARGET//-/_}" >>"$GITHUB_ENV"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ inputs.package }}
          FEATURES: ${{ matrix.features }}
          ZIG: ${{ matrix.zig }}
          GLIBC_FLOOR: ${{ inputs.glibc-floor }}
        run: |
          set -euo pipefail
          if [[ "$ZIG" == true ]]; then
            # word-split is intentional: FEATURES is a validated flag list
            # shellcheck disable=SC2086
            cargo zigbuild --release --locked --target "$TARGET.$GLIBC_FLOOR" -p "$PACKAGE" $FEATURES
          else
            # word-split is intentional: FEATURES is a validated flag list
            # shellcheck disable=SC2086
            cargo build --release --locked --target "$TARGET" -p "$PACKAGE" $FEATURES
          fi

      - name: Check glibc floor
        if: matrix.zig
        uses: $/actions/glibc-floor
        with:
          binary: ${{ inputs.working-directory }}/target/${{ matrix.target }}/release/${{ inputs.bin }}
          floor: ${{ inputs.glibc-floor }}

      - name: Package
        working-directory: ${{ inputs.working-directory }}
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          bin="$BIN"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver='0.0.0-dev'
          fi
          target="$TARGET"
          staging="$bin-$ver${VARIANT:+-$VARIANT}-$target"
          exe="$bin"
          [[ "$target" == *windows* ]] && exe="$exe.exe"

          mkdir -p dist "$staging"
          cp "target/$target/release/$exe" "$staging/"
          # Copy any LICENSE* and README* files that exist (tolerant to single-license projects).
          shopt -s nullglob
          for f in LICENSE* README*; do cp "$f" "$staging/"; done
          shopt -u nullglob

          if [[ "$target" == *windows* ]]; then
            (cd "$staging" && 7z a "../dist/$staging.zip" .)
            asset="dist/$staging.zip"
          else
            tar czf "dist/$staging.tar.gz" -C "$staging" .
            asset="dist/$staging.tar.gz"
          fi

          # Canonical GNU text format with the bare asset name so consumers can run
          # `sha256sum -c <name>.sha256` in the download directory. Verification is
          # fail-closed: a checksum that does not verify breaks the release build.
          name="$(basename "$asset")"
          if command -v sha256sum &>/dev/null; then
            hash="$(sha256sum "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$name" >"dist/$name.sha256"
            (cd dist && sha256sum -c "$name.sha256")
          else
            hash="$(shasum -a 256 "$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$name" >"dist/$name.sha256"
            (cd dist && shasum -a 256 -c "$name.sha256")
          fi

          rm -rf "$staging"

      - name: SBOM
        if: inputs.sbom
        working-directory: ${{ inputs.working-directory }}
        env:
          BIN: ${{ inputs.bin }}
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg p "$PACKAGE" '.packages[] | select(.name == $p) | .manifest_path')"
          if [[ -z "$manifest" ]]; then
            echo "::error::no manifest for package ${PACKAGE}"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver='0.0.0-dev'
          fi
          stem="$BIN-$ver${VARIANT:+-$VARIANT}-$TARGET"
          # word-split is intentional: FEATURES is a validated flag list
          # shellcheck disable=SC2086
          cargo cyclonedx --manifest-path "$manifest" --format json --spec-version 1.5 \
            --target "$TARGET" $FEATURES --override-filename "$stem.cdx"
          # cargo writes the SBOM next to the manifest; normalise Windows
          # backslashes so dirname works under Git Bash.
          mv "$(dirname "${manifest//\\//}")/$stem.cdx.json" dist/
          jq -e '.bomFormat == "CycloneDX"' "dist/$stem.cdx.json" >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.variant != '' && format('{0}-', matrix.variant) || '' }}${{ matrix.target }}
          path: ${{ inputs.working-directory }}/dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.variant != '' && format('{0} ', matrix.variant) || '' }}${{ matrix.target }}
    needs: [plan, build]
    if: inputs.smoke-command != ''
    runs-on: ${{ matrix.smoke_os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.variant != '' && format('{0}-', matrix.variant) || '' }}${{ matrix.target }}

      - name: Verify and smoke
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::expected exactly one archive, got ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          if command -v sha256sum &>/dev/null; then
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 -c "$archive.sha256"
          fi
          if [[ "$archive" == *.zip ]]; then
            7z x "$archive"
            exe="./$BIN.exe"
          else
            tar xzf "$archive"
            exe="./$BIN"
          fi
          # word-split is intentional: whitespace-separated smoke arguments
          # shellcheck disable=SC2086
          "$exe" $SMOKE_COMMAND

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.publish.outputs.url }}
      tag-name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "name=${REF#refs/tags/}" >>"$GITHUB_OUTPUT"

      - name: Resolve prerelease flag
        id: pre
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ -(alpha|beta|rc|preview|pre|dev|nightly)($|[.0-9-]) ]]; then
            echo 'flag=true' >>"$GITHUB_OUTPUT"
          else
            echo 'flag=false' >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Resolve asset globs
        id: assets
        env:
          BIN: ${{ inputs.bin }}
          SBOM: ${{ inputs.sbom }}
          CHECKSUMS_FILE: ${{ inputs.checksums-file }}
        run: |
          set -euo pipefail
          {
            echo 'files<<EOF'
            printf '%s\n' "${BIN}-*.tar.gz" "${BIN}-*.zip" "${BIN}-*.sha256"
            [[ "$SBOM" == 'true' ]] && printf '%s\n' "${BIN}-*.cdx.json"
            [[ "$CHECKSUMS_FILE" == 'true' ]] && printf '%s\n' 'SHA256SUMS'
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Write SHA256SUMS
        if: inputs.checksums-file
        env:
          BIN: ${{ inputs.bin }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sums=("${BIN}"-*.sha256)
          if [[ ${#sums[@]} -eq 0 ]]; then
            echo '::error::no .sha256 files to aggregate into SHA256SUMS'
            exit 1
          fi
          mapfile -t sorted < <(printf '%s\n' "${sums[@]}" | sort)
          cat "${sorted[@]}" >SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header

      # A draft for the tag is fine: action-gh-release finds it via its
      # listReleases fallback (getReleaseByTag 404s on drafts) and updates it.
      # An already-published release must not be mutated — with GitHub
      # immutable releases asset uploads would fail anyway, so fail closed.
      - name: Guard against an existing published release
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" \
            && [[ "$state" == 'false' ]]; then
            echo "::error::release for tag ${TAG} is already published; refusing to mutate it"
            exit 1
          fi

      # Draft-first: upload every asset while the release is still a draft,
      # then publish. Required for GitHub immutable releases (assets are
      # locked at publish) and recommended for all releases so "Latest"
      # never points at a release whose assets are still uploading.
      - name: Create draft GitHub Release
        id: gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.cliff.outputs.content }}
          files: ${{ steps.assets.outputs.files }}
          prerelease: ${{ steps.pre.outputs.flag }}
          draft: true

      - name: Publish release
        id: publish
        env:
          TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE: ${{ steps.pre.outputs.flag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=true
          [[ "$PRERELEASE" == 'true' ]] && latest=false
          gh release edit "$TAG" --draft=false "--latest=$latest"
          url="$(gh release view "$TAG" --json url -q .url)"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Summarize
        env:
          URL: ${{ steps.publish.outputs.url }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "Released ${TAG}: ${URL}" >>"$GITHUB_STEP_SUMMARY"
