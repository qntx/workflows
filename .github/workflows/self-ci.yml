name: Self / CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qntx-workflows-self-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  ZIZMOR_VERSION: '1.30.1'
  ZIZMOR_SHA256: 'e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a'
  PINACT_VERSION: '5.0.0'
  PINACT_SHA256: 'd005bbb85da80dacdc07816f24a5da723a9f6d1e9f3d3e7e73df33f9caa1358f'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color .github/workflows/*.yml

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: $/actions/hardened-checkout
      - name: Install zizmor
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c
          tar -xzf zizmor.tar.gz
          install -m 0755 zizmor "$HOME/.local/bin/zizmor"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Run zizmor
        run: |
          set -euo pipefail
          zizmor --config .zizmor.yml --min-severity=medium --format=sarif \
            actions .github/workflows >"$RUNNER_TEMP/zizmor.sarif"
          zizmor --config .zizmor.yml --min-severity=medium \
            actions .github/workflows
      - name: Upload zizmor SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
      - name: Install pinact
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          curl -fsSL -o pinact.tar.gz \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  pinact.tar.gz" | sha256sum -c
          tar -xzf pinact.tar.gz
          install -m 0755 pinact "$HOME/.local/bin/pinact"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Run pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment .github/workflows/*.yml actions/*/action.yml

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install and check
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run format:check
          bun run markdownlint

  composites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
      - name: Test composites
        run: |
          set -euo pipefail
          bash actions/protect-sync-path/test.sh
          bash actions/parse-env-block/test.sh
          bash actions/apt-install/test.sh
          bash actions/setup-rust/test.sh
          bash actions/setup-wasm/test.sh
          bash actions/ops-dependabot-enable/test.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install and test validator
        working-directory: actions/validate-docs-tree
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test

  docs:
    uses: $/.github/workflows/ci-docs.yml
    permissions:
      contents: read
    with:
      docs-path: actions/validate-docs-tree/fixtures/valid-docs

  e2e-rust:
    uses: $/.github/workflows/ci-rust.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/rust
      deny: true

  e2e-rust-minimal:
    uses: $/.github/workflows/ci-rust.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/rust
      features: --no-default-features
      doc: true
      package-check: true

  e2e-rust-packages:
    uses: $/.github/workflows/ci-rust.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/rust
      features: --no-default-features
      packages: fixture-a fixture-b
      doc: true

  e2e-bun:
    uses: $/.github/workflows/ci-bun.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/bun

  e2e-bun-rust:
    uses: $/.github/workflows/ci-bun.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/bun
      rust: true
      scripts: test:rust

  e2e-fuzz:
    uses: $/.github/workflows/ci-rust-fuzz.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/fuzz
      max-total-time: 10

  e2e-wasm:
    uses: $/.github/workflows/ci-wasm.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/wasm
      install-directory: fixtures/wasm
      cargo-directory: fixtures/wasm
      rust-checks: false
      dist-export: .
      scripts: test:extra

  e2e-wasm-scripts-dir:
    uses: $/.github/workflows/ci-wasm.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/wasm
      install-directory: fixtures/wasm
      cargo-directory: fixtures/wasm
      rust-checks: false
      dist-export: .
      scripts: e2e:scripts-dir
      scripts-directory: fixtures/wasm/scripts

  e2e-wasm-c:
    uses: $/.github/workflows/ci-wasm.yml
    permissions:
      contents: read
    with:
      language: c
      rust-checks: false
      working-directory: fixtures/wasm-c
      install-directory: fixtures/wasm-c
      dist-export: .

  e2e-rust-each-feature:
    uses: $/.github/workflows/ci-rust.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/rust
      features: --no-default-features --features alpha,beta
      each-feature: true
      packages: fixture-c

  e2e-cross:
    uses: $/.github/workflows/ci-rust-cross.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/cross
      targets: wasm32-unknown-unknown aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: fixture-cross
      forbid-deps: itoa

  e2e-cross-features:
    uses: $/.github/workflows/ci-rust-cross.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/cross
      targets: wasm32-unknown-unknown
      packages: fixture-cross
      features: --no-default-features --features itoa

  e2e-publish-crates:
    uses: $/.github/workflows/publish-crates.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/rust
      packages: fixture-a fixture-b
      dry-run: true

  e2e-publish-npm:
    uses: $/.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      install-directory: fixtures/npm
      working-directory: fixtures/npm
      dry-run: true

  e2e-publish-npm-wasm:
    uses: $/.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      wasm: true
      timeout-minutes: 30
      install-directory: fixtures/wasm
      working-directory: fixtures/wasm
      cargo-directory: fixtures/wasm
      dist-export: .
      dry-run: true

  e2e-publish-npm-wasm-c:
    uses: $/.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      wasm: true
      language: c
      timeout-minutes: 30
      install-directory: fixtures/wasm-c
      working-directory: fixtures/wasm-c
      dist-export: .
      dry-run: true

  e2e-publish-npm-artifact-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - name: Stage prebuilt artifact
        run: |
          set -euo pipefail
          mkdir -p staging/dist
          echo 'export const prebuilt = true;' > staging/dist/bundle.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-artifact-fixture
          path: staging

  e2e-publish-npm-artifact:
    needs: e2e-publish-npm-artifact-upload
    uses: $/.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      install-directory: fixtures/npm-artifact
      working-directory: fixtures/npm-artifact
      artifact: npm-artifact-fixture
      dry-run: true

  e2e-hermes:
    uses: $/.github/workflows/ci-hermes.yml
    permissions:
      contents: read
    with:
      # Same commit nostr.js pins (RN 0.86 → hermes-v250829098.0.17).
      hermes-commit: 3477757eb2475555cf8d8df24bfb1deb0613880d
      working-directory: fixtures/hermes

  # The callee declares `contents: write` for its tag-only `release` job, and a
  # caller must grant every permission a called workflow requests. Self-CI never
  # runs on tag refs, so `release` stays gated off; the caller-side guard keeps
  # that true if the triggers ever change.
  e2e-release-rust:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: $/.github/workflows/release-rust.yml
    permissions:
      contents: write
    with:
      working-directory: fixtures/release
      bin: fixture-bin
      package: fixture-bin
      targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-musl aarch64-unknown-linux-musl

  e2e-release-rust-verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: e2e-release-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: downloads

      - name: Verify checksums as a consumer
        working-directory: downloads
        run: |
          set -euo pipefail
          shopt -s nullglob
          sums=(*.sha256)
          if [[ ${#sums[@]} -eq 0 ]]; then
            echo '::error::no .sha256 files in merged dist artifacts'
            exit 1
          fi
          for f in "${sums[@]}"; do
            asset="${f%.sha256}"
            name="$(awk '{print $2}' "$f")"
            if [[ "$name" != "$asset" ]]; then
              echo "::error::$f second field is '$name', expected bare name '$asset'"
              exit 1
            fi
            sha256sum -c "$f"
            shasum -a 256 -c "$f"
          done
          echo "verified ${#sums[@]} checksum files"

      # x86_64 musl runs natively on the amd64 runner; the aarch64 musl
      # archive is verified on ubuntu-24.04-arm in its own job.
      - name: Verify x86_64 musl binary is static and runs
        working-directory: downloads
        run: |
          set -euo pipefail
          tar xzf fixture-bin-0.0.0-dev-x86_64-unknown-linux-musl.tar.gz
          file fixture-bin | grep -Eq 'statically linked|static-pie linked'
          ./fixture-bin | grep -q 'fixture-bin:'

  e2e-release-rust-musl-arm-verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: e2e-release-rust
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download aarch64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-musl
          path: downloads

      - name: Verify aarch64 musl binary is static and runs
        working-directory: downloads
        run: |
          set -euo pipefail
          tar xzf fixture-bin-0.0.0-dev-aarch64-unknown-linux-musl.tar.gz
          file fixture-bin | grep -Eq 'statically linked|static-pie linked'
          ./fixture-bin | grep -q 'fixture-bin:'

  # Same tag guard as e2e-release-rust. `artifact-prefix` keeps this call's
  # uploads apart from e2e-release-rust's dist-<target> artifacts (names are
  # unique per run), and `subset-*` never matches that pair's `dist-*` glob.
  e2e-release-rust-targets:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: $/.github/workflows/release-rust.yml
    permissions:
      contents: write
    with:
      working-directory: fixtures/release
      bin: fixture-bin
      package: fixture-bin
      targets: x86_64-unknown-linux-gnu aarch64-apple-darwin
      artifact-prefix: subset

  e2e-release-rust-targets-verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: e2e-release-rust-targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: subset-*
          merge-multiple: true
          path: downloads

      - name: Verify the exact asset set
        working-directory: downloads
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=(
            fixture-bin-0.0.0-dev-aarch64-apple-darwin.tar.gz
            fixture-bin-0.0.0-dev-aarch64-apple-darwin.tar.gz.sha256
            fixture-bin-0.0.0-dev-x86_64-unknown-linux-gnu.tar.gz
            fixture-bin-0.0.0-dev-x86_64-unknown-linux-gnu.tar.gz.sha256
          )
          mapfile -t got < <(printf '%s\n' * | sort)
          if ! diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${got[@]}"); then
            echo '::error::dist artifacts are not exactly the two requested targets'
            exit 1
          fi
          for f in *.sha256; do
            sha256sum -c "$f"
          done
          echo "asset set matches the targets input"

  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard

  ci:
    name: Self / CI
    if: always()
    needs:
      [
        actionlint,
        zizmor,
        pinact,
        format,
        composites,
        tests,
        docs,
        e2e-rust,
        e2e-rust-minimal,
        e2e-rust-packages,
        e2e-rust-each-feature,
        e2e-bun,
        e2e-bun-rust,
        e2e-fuzz,
        e2e-wasm,
        e2e-wasm-scripts-dir,
        e2e-wasm-c,
        e2e-cross,
        e2e-cross-features,
        e2e-publish-crates,
        e2e-publish-npm,
        e2e-publish-npm-wasm,
        e2e-publish-npm-wasm-c,
        e2e-publish-npm-artifact-upload,
        e2e-publish-npm-artifact,
        e2e-hermes,
        e2e-release-rust,
        e2e-release-rust-verify,
        e2e-release-rust-musl-arm-verify,
        e2e-release-rust-targets,
        e2e-release-rust-targets-verify,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require all lint jobs
        if: >-
          ${{ needs.actionlint.result != 'success'
          || needs.zizmor.result != 'success'
          || needs.pinact.result != 'success'
          || needs.format.result != 'success'
          || needs.composites.result != 'success'
          || needs.tests.result != 'success'
          || needs.docs.result != 'success'
          || needs.e2e-rust.result != 'success'
          || needs.e2e-rust-minimal.result != 'success'
          || needs.e2e-rust-packages.result != 'success'
          || needs.e2e-rust-each-feature.result != 'success'
          || needs.e2e-bun.result != 'success'
          || needs.e2e-bun-rust.result != 'success'
          || needs.e2e-fuzz.result != 'success'
          || needs.e2e-wasm.result != 'success'
          || needs.e2e-wasm-scripts-dir.result != 'success'
          || needs.e2e-cross.result != 'success'
          || needs.e2e-cross-features.result != 'success'
          || needs.e2e-publish-crates.result != 'success'
          || needs.e2e-publish-npm.result != 'success'
          || needs.e2e-publish-npm-wasm.result != 'success'
          || needs.e2e-publish-npm-wasm-c.result != 'success'
          || needs.e2e-publish-npm-artifact.result != 'success'
          || needs.e2e-hermes.result != 'success'
          || needs.e2e-release-rust.result != 'success'
          || needs.e2e-release-rust-verify.result != 'success'
          || needs.e2e-release-rust-musl-arm-verify.result != 'success'
          || needs.e2e-release-rust-targets.result != 'success'
          || needs.e2e-release-rust-targets-verify.result != 'success' }}
        run: |
          echo '::error::a required Self / CI job failed, was cancelled, or was skipped'
          exit 1
