name: Publish / crates.io

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Debian-like runner label (apt + GNU date).'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      packages:
        description: 'Space-separated list of package names to publish. Empty publishes the root crate.'
        required: false
        type: string
        default: ''
      rust-version:
        description: 'Rust toolchain (stable, beta, nightly, or a pinned version).'
        required: false
        type: string
        default: 'stable'
      apt-packages:
        description: 'Extra apt packages to install (space-separated).'
        required: false
        type: string
        default: ''
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: 'Cargo registry token for publishing.'
        required: true

permissions:
  contents: read

concurrency:
  group: qntx-workflows-publish-crates-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - uses: $/actions/apt-install
        with:
          packages: ${{ inputs.apt-packages }}

      - uses: $/actions/setup-rust
        with:
          rust-version: ${{ inputs.rust-version }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --release --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - uses: $/actions/publish-crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        with:
          packages: ${{ inputs.packages }}
          working-directory: ${{ inputs.working-directory }}
