name: CI / C++

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Debian-like required (apt).'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      submodules:
        description: 'Checkout git submodules recursively when true.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 30
      apt-packages:
        description: 'Extra apt packages to install (space-separated).'
        required: false
        type: string
        default: ''
      build-type:
        description: 'CMake build type (Release, Debug, RelWithDebInfo).'
        required: false
        type: string
        default: 'Release'
      enable-tests:
        description: 'Run ctest after build.'
        required: false
        type: boolean
        default: true
      cmake-args:
        description: 'Extra arguments passed to cmake configure.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: qntx-workflows-ci-cpp-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
      CMAKE_ARGS: ${{ inputs.cmake-args }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - uses: $/actions/apt-install
        with:
          packages: ${{ inputs.apt-packages }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23

      - name: Record toolchain
        run: |
          set -euo pipefail
          {
            echo '## CI / C++'
            echo "- cmake: $(cmake --version | head -n1)"
            echo "- ccache: $(ccache --version | head -n1)"
            echo "- build-type: $BUILD_TYPE"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Configure CMake
        run: |
          set -euo pipefail
          # word-split is intentional
          # shellcheck disable=SC2086
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            $CMAKE_ARGS

      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" --parallel

      - name: Test
        if: inputs.enable-tests
        working-directory: ${{ inputs.working-directory }}/build
        run: ctest --output-on-failure --build-config "$BUILD_TYPE"

      - name: Skip tests
        if: ${{ !inputs.enable-tests }}
        run: |
          echo '- skipped: ctest' >>"$GITHUB_STEP_SUMMARY"
