name: Publish / PyPI

# Non-empty PYPI_TOKEN ⇒ token path, attestations always false; caller need not grant id-token.
# Empty PYPI_TOKEN ⇒ OIDC path, attestations from input (default true); caller must set
# id-token: write and attestations: write.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      python-version:
        description: 'Python version to use for building.'
        required: false
        type: string
        default: '3.13'
      repository-url:
        description: 'PyPI repository URL (use test.pypi.org for staging).'
        required: false
        type: string
        default: ''
      environment:
        description: 'GitHub environment name. Empty string skips environment protection.'
        required: false
        type: string
        default: ''
      attestations:
        description: 'OIDC path only. Token path always false.'
        required: false
        type: boolean
        default: true
    secrets:
      PYPI_TOKEN:
        description: 'Optional. When set, token path is used and attestations are off.'
        required: false
    outputs:
      attestations:
        description: 'Whether attestations were requested on the OIDC path.'
        value: ${{ jobs.publish.outputs.attestations }}

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: qntx-workflows-publish-pypi-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Empty string is no environment protection; do not omit the key.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      attestations: ${{ steps.auth.outputs.mode == 'oidc' && inputs.attestations || false }}
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ inputs.python-version }}

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          set -euo pipefail
          uv pip install --system twine
          twine check dist/*

      - id: auth
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          repository-url: ${{ inputs.repository-url }}
          packages-dir: ${{ inputs.working-directory }}/dist
          attestations: ${{ steps.auth.outputs.mode == 'oidc' && inputs.attestations || false }}
