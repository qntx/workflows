name: Publish / PyPI

# Token and OIDC need different job permissions; GitHub will not let one job
# request id-token: write when the caller only granted contents: read.
# jobs.publish = token. jobs.oidc = OIDC. Both set name: publish.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      python-version:
        description: 'Python version to use for building.'
        required: false
        type: string
        default: '3.13'
      repository-url:
        description: 'PyPI repository URL (use test.pypi.org for staging).'
        required: false
        type: string
        default: ''
      environment:
        description: 'GitHub environment name. Empty string skips environment protection.'
        required: false
        type: string
        default: ''
      attestations:
        description: 'OIDC path only. Token path always false.'
        required: false
        type: boolean
        default: true
    secrets:
      PYPI_TOKEN:
        description: 'Optional. When set, token path is used and attestations are off.'
        required: false
    outputs:
      attestations:
        description: 'Whether attestations were requested on the OIDC path.'
        value: ${{ jobs.route.outputs.mode == 'oidc' && inputs.attestations || false }}

permissions:
  contents: read

concurrency:
  group: qntx-workflows-publish-pypi-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.r.outputs.mode }}
    steps:
      - id: r
        env:
          TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN}" ]; then
            echo 'mode=token' >>"$GITHUB_OUTPUT"
          else
            echo 'mode=oidc' >>"$GITHUB_OUTPUT"
          fi

  publish:
    name: publish
    needs: route
    if: ${{ needs.route.outputs.mode == 'token' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - uses: $/actions/publish-pypi
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          repository-url: ${{ inputs.repository-url }}
          attestations: false
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  oidc:
    name: publish
    needs: route
    if: ${{ needs.route.outputs.mode == 'oidc' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - uses: $/actions/publish-pypi
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          repository-url: ${{ inputs.repository-url }}
          attestations: ${{ inputs.attestations }}
