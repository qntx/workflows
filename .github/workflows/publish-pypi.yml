name: Publish / PyPI

# Token only. PyPI trusted publishing does not support reusable workflows from
# another repository (https://github.com/pypi/warehouse/issues/11096), so OIDC
# cannot succeed from a caller repo. Callers must pass PYPI_TOKEN.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Working directory relative to the repository root.'
        required: false
        type: string
        default: '.'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 15
      python-version:
        description: 'Python version to use for building.'
        required: false
        type: string
        default: '3.13'
      repository-url:
        description: 'PyPI repository URL (use test.pypi.org for staging).'
        required: false
        type: string
        default: ''
      environment:
        description: 'GitHub environment name. Empty string skips environment protection.'
        required: false
        type: string
        default: ''
    secrets:
      PYPI_TOKEN:
        description: 'PyPI API token.'
        required: true

permissions:
  contents: read

concurrency:
  group: qntx-workflows-publish-pypi-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: $/actions/hardened-checkout
        with:
          persist-credentials: false
      - uses: $/actions/publish-pypi
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          repository-url: ${{ inputs.repository-url }}
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
