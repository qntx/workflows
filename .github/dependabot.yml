version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/actions/*'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'github_actions'
    open-pull-requests-limit: 10
  - package-ecosystem: 'bun'
    directories:
      - '/'
      - '/actions/validate-docs-tree'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10
