name: publish-crates
description: Publish crates.io packages with already-uploaded skip and 429 backoff.
inputs:
  packages:
    required: false
    default: ''
  working-directory:
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ inputs.packages }}
        CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
