name: publish-crates
description: Publish crates.io packages with already-uploaded skip and 429 backoff.
inputs:
  packages:
    description: 'Whitespace-separated crate names to publish in order. Empty = publish the current manifest.'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the cargo manifest.'
    required: false
    default: '.'
  dry-run:
    description: 'Pass --dry-run to cargo publish. A package list publishes in one topological invocation; CARGO_REGISTRY_TOKEN is not required.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGES: ${{ inputs.packages }}
        DRY_RUN: ${{ inputs.dry-run }}
        CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
