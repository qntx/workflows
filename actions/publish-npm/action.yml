name: publish-npm
description: 'Publish a packed npm tarball with OIDC trusted publishing. Caller job must grant id-token: write.'
inputs:
  artifact:
    description: 'upload-artifact name produced by pack-npm — the tarball plus its .sha256.'
    required: true
  package:
    description: 'package.json name, forwarded from pack-npm.'
    required: true
  version:
    description: 'package.json version, forwarded from pack-npm.'
    required: true
  node-version:
    required: false
    default: '24'
  access:
    required: false
    default: 'public'
  dry-run:
    description: 'Publish with npm publish --dry-run instead of --provenance. The npm >= 11.5.1 gate is skipped.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Download the packed tarball
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: pack

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # Trusted publishing exists only on registry.npmjs.org.
        registry-url: 'https://registry.npmjs.org'

    - name: Verify the tarball checksum
      shell: bash
      working-directory: pack
      run: |
        set -euo pipefail
        # The publish job has no install or build — this is the whole
        # provenance chain from the unprivileged pack job to what npm sees.
        sha256sum -c -- *.sha256

    - name: Check whether the version already exists
      id: pkg
      shell: bash
      env:
        PKG: ${{ inputs.package }}
        VER: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # A rerun after a partial release, or a version published by hand
        # (a new package needs one manual publish before trusted publishing
        # can be configured), must not fail on the existing version.
        if out="$(npm view "${PKG}@${VER}" version 2>&1)"; then
          exists=false
          [ "$out" = "$VER" ] && exists=true
        else
          case "$out" in
            *E404*) exists=false ;;
            *)
              echo "::error::npm view ${PKG}@${VER} failed: ${out}"
              exit 1
              ;;
          esac
        fi
        echo "exists=${exists}" >> "$GITHUB_OUTPUT"
        if [ "$exists" = true ]; then
          echo "::notice::${PKG}@${VER} is already on the registry; skipping publish"
        fi

    - name: Publish
      if: steps.pkg.outputs.exists != 'true'
      shell: bash
      working-directory: pack
      env:
        ACCESS: ${{ inputs.access }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        tgz="$(ls -- *.tgz | head -n1)"
        # --ignore-scripts always: the tarball is never repacked on this side.
        if [ "$DRY_RUN" = true ]; then
          npm publish "$tgz" --access "$ACCESS" --ignore-scripts --dry-run
          exit 0
        fi
        npm_v="$(npm --version)"
        if [ "$(printf '11.5.1\n%s\n' "$npm_v" | sort -V | head -n1)" != '11.5.1' ]; then
          echo "::error::npm ${npm_v} does not support OIDC trusted publishing (needs npm >= 11.5.1; raise node-version)"
          exit 1
        fi
        npm publish "$tgz" --access "$ACCESS" --ignore-scripts --provenance
