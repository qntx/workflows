name: publish-npm
description: 'Install, build, test, and npm publish with OIDC trusted publishing. Caller job must grant id-token: write.'
inputs:
  install-directory:
    required: false
    default: '.'
  working-directory:
    required: false
    default: '.'
  package-manager:
    required: false
    default: 'npm'
  node-version:
    required: false
    default: '24'
  bun-version:
    required: false
    default: '1.4'
  access:
    required: false
    default: 'public'
  wasm:
    description: 'Skip the generic build, run build:wasm once, publish with --ignore-scripts. Requires setup-wasm earlier in the job.'
    required: false
    default: 'false'
  dist-export:
    description: 'Package exports key checked by the wasm dist contract. "." selects the root export of a dedicated wasm package.'
    required: false
    default: './wasm'
  dry-run:
    description: 'Publish with npm publish --dry-run instead of --provenance. The npm >= 11.5.1 gate is skipped.'
    required: false
    default: 'false'
outputs:
  package:
    value: ${{ steps.pkg.outputs.package }}
  version:
    value: ${{ steps.pkg.outputs.version }}
runs:
  using: composite
  steps:
    - name: Set up Bun
      if: ${{ inputs.package-manager == 'bun' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Enable Corepack
      if: ${{ inputs.package-manager == 'pnpm' || inputs.package-manager == 'yarn' }}
      shell: bash
      working-directory: ${{ inputs.install-directory }}
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # Trusted publishing exists only on registry.npmjs.org.
        registry-url: 'https://registry.npmjs.org'
        cache: ${{ inputs.package-manager != 'bun' && inputs.package-manager || '' }}
        cache-dependency-path: |
          ${{ inputs.install-directory }}/package-lock.json
          ${{ inputs.install-directory }}/pnpm-lock.yaml
          ${{ inputs.install-directory }}/yarn.lock
          ${{ inputs.install-directory }}/npm-shrinkwrap.json
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.install-directory }}
      env:
        PM: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        case "$PM" in
          npm) npm ci ;;
          pnpm)
            corepack enable
            pnpm install --frozen-lockfile
            ;;
          yarn)
            corepack enable
            if yarn --version | grep -q '^1\.'; then
              yarn install --frozen-lockfile
            else
              yarn install --immutable
            fi
            ;;
          bun)
            bun install --frozen-lockfile
            ;;
          *)
            echo "::error::Unsupported package manager: $PM"
            exit 1
            ;;
        esac

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ inputs.package-manager }}
        WASM: ${{ inputs.wasm }}
      run: |
        set -euo pipefail
        if [ "$WASM" = true ]; then
          case "$PM" in
            bun) bun run build:wasm ;;
            npm) npm run build:wasm ;;
            *)
              echo "::error::Unsupported package manager: $PM"
              exit 1
              ;;
          esac
        else
          case "$PM" in
            npm)
              npm run build --if-present
              ;;
            bun)
              if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
                bun run build
              fi
              ;;
            *)
              if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
                "$PM" run build
              fi
              ;;
          esac
        fi

    - name: Check wasm dist
      if: ${{ inputs.wasm == 'true' }}
      uses: $/actions/setup-wasm
      with:
        toolchain: false
        dist-check: true
        package-directory: ${{ inputs.working-directory }}
        package-manager: ${{ inputs.package-manager }}
        dist-export: ${{ inputs.dist-export }}

    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PM: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        case "$PM" in
          npm)
            npm test --if-present
            ;;
          bun)
            # scripts.test wins: the file heuristic only searches three levels
            # deep and would run a different runner than the declared script.
            if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              bun run test
            elif find . -maxdepth 3 -not -path './node_modules/*' -not -path './.git/*' \
                 \( -name '*.test.*' -o -name '*.spec.*' -o -path './test/*' -o -path './tests/*' \) \
                 -print -quit | grep -q .; then
              bun test
            fi
            ;;
          *)
            if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              "$PM" test
            fi
            ;;
        esac

    - id: pkg
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        name="$(jq -r .name package.json)"
        version="$(jq -r .version package.json)"
        echo "package=${name}" >> "$GITHUB_OUTPUT"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        # A rerun after a partial release, or a version published by hand
        # (a new package needs one manual publish before trusted publishing
        # can be configured), must not fail on the existing version.
        if out="$(npm view "${name}@${version}" version 2>&1)"; then
          exists=false
          [ "$out" = "$version" ] && exists=true
        else
          case "$out" in
            *E404*) exists=false ;;
            *)
              echo "::error::npm view ${name}@${version} failed: ${out}"
              exit 1
              ;;
          esac
        fi
        echo "exists=${exists}" >> "$GITHUB_OUTPUT"
        if [ "$exists" = true ]; then
          echo "::notice::${name}@${version} is already on the registry; skipping publish"
        fi

    - name: Publish
      if: steps.pkg.outputs.exists != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACCESS: ${{ inputs.access }}
        WASM: ${{ inputs.wasm }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=(--access "$ACCESS")
        if [ "$WASM" = true ]; then
          args+=(--ignore-scripts)
        fi
        if [ "$DRY_RUN" = true ]; then
          npm publish "${args[@]}" --dry-run
          exit 0
        fi
        npm_v="$(npm --version)"
        if [ "$(printf '11.5.1\n%s\n' "$npm_v" | sort -V | head -n1)" != '11.5.1' ]; then
          echo "::error::npm ${npm_v} does not support OIDC trusted publishing (needs npm >= 11.5.1; raise node-version)"
          exit 1
        fi
        npm publish "${args[@]}" --provenance
