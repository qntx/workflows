name: validate-docs-tree
description: Fail-closed Fumadocs library-tree check.
inputs:
  docs-path:
    description: Absolute path to the docs tree.
    required: true
runs:
  using: composite
  steps:
    - run: bun "${{ github.action_path }}/validate-docs-tree.ts" "${{ inputs.docs-path }}" --lint
      shell: bash
