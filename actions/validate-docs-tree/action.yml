name: validate-docs-tree
description: Fail-closed Fumadocs library-tree check.
inputs:
  working-directory:
    description: 'Working directory relative to GITHUB_WORKSPACE.'
    required: false
    default: '.'
  docs-path:
    description: 'Docs tree relative to working-directory.'
    required: false
    default: 'docs'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      env:
        WORKDIR: ${{ inputs.working-directory }}
        DOCS_PATH: ${{ inputs.docs-path }}
      run: |
        set -euo pipefail
        bun install --frozen-lockfile
        bun validate-docs-tree.ts --lint
