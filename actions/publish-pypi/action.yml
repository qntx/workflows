name: publish-pypi
description: Build a Python dist and upload with uv publish. Caller job sets token vs OIDC permissions.
inputs:
  working-directory:
    required: false
    default: '.'
  python-version:
    required: false
    default: '3.13'
  repository-url:
    required: false
    default: ''
  attestations:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false
        python-version: ${{ inputs.python-version }}

    - name: Build package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv build

    - name: Check distribution
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        uvx twine check dist/*

    - name: Publish to PyPI
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UV_PUBLISH_TOKEN: ${{ env.PYPI_TOKEN }}
        UV_PUBLISH_URL: ${{ inputs.repository-url }}
        ATTESTATIONS: ${{ inputs.attestations }}
      run: |
        set -euo pipefail
        extra=()
        if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
          extra+=(--trusted-publishing always)
        fi
        if [ -n "${UV_PUBLISH_URL:-}" ]; then
          extra+=(--publish-url "$UV_PUBLISH_URL")
        fi
        if [ "${ATTESTATIONS}" != "true" ]; then
          extra+=(--no-attestations)
        fi
        uv publish "${extra[@]}"
