name: publish-pypi
description: Build a Python dist and upload with uv publish. Token only; PYPI_TOKEN required.
inputs:
  working-directory:
    required: false
    default: '.'
  python-version:
    required: false
    default: '3.13'
  repository-url:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
        python-version: ${{ inputs.python-version }}

    - name: Build package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv build

    - name: Check distribution
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        uvx twine check dist/*

    - name: Publish to PyPI
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UV_PUBLISH_TOKEN: ${{ env.PYPI_TOKEN }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
      run: |
        set -euo pipefail
        extra=()
        if [ -n "${REPOSITORY_URL:-}" ]; then
          extra+=(--publish-url "$REPOSITORY_URL")
        fi
        uv publish "${extra[@]}"
