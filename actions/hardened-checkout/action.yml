name: hardened-checkout
description: Pin-safe checkout with persist-credentials default false.
inputs:
  persist-credentials:
    description: 'Leave the git credential in .git/config after checkout. Keep false unless later steps push.'
    required: false
    default: 'false'
  submodules:
    description: 'Checkout submodules: false, true or recursive.'
    required: false
    default: 'false'
  fetch-depth:
    description: 'Number of commits to fetch. 0 fetches the full history.'
    required: false
    default: '1'
  token:
    description: 'Token used to fetch the repository.'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'Repository to checkout as owner/repo. Empty = current repository.'
    required: false
    default: ''
  ref:
    description: 'Branch, tag or SHA to checkout. Empty = event default.'
    required: false
    default: ''
  path:
    description: 'Directory under the workspace to checkout into. Empty = workspace root.'
    required: false
    default: ''
  sparse-checkout:
    description: 'Newline-separated sparse-checkout patterns. Empty or `.` = full checkout (`.` would be an empty tree in non-cone mode).'
    required: false
    default: ''
  sparse-checkout-cone-mode:
    description: 'Use cone mode when sparse-checkout is set.'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # checkout's own fallbacks cover empty repository/path/ref; only
    # sparse-checkout needs help: '.' is an empty tree in non-cone mode.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        submodules: ${{ inputs.submodules }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        sparse-checkout: ${{ inputs.sparse-checkout != '.' && inputs.sparse-checkout || '' }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
