# Caller owns on:. Pin at @v2.
# Product extras (e.g. no-std) stay sibling jobs in this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      rust-version: stable
      # deny: true   # requires deny.toml next to Cargo.toml
