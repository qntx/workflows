# Caller owns on:. Pin at @v2.
# Product extras (e.g. no-std) stay sibling jobs in this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    with:
      # rust-version: stable   # default '' honours <working-directory>/rust-toolchain{,.toml}, else stable
      # deny: true   # requires deny.toml next to Cargo.toml
      # packages: my-crate other-crate   # per-package -p runs; no feature unification across members
      # doc: true    # cargo doc --workspace --no-deps with RUSTDOCFLAGS=-D warnings
      # package-check: true   # cargo publish --workspace --dry-run --locked
      # each-feature: true   # cargo hack check --each-feature --no-dev-deps per package (or --workspace)
      # features: '--no-default-features --features a,b'   # also: --all-features, --no-default-features, --features a,b
