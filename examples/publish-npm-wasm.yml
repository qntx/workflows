# Caller owns on:. Pin at @v2.
# OIDC. Do not set environment, runs-on, or steps.
# Required check-run on a tag: publish / publish.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      wasm: true
      timeout-minutes: 30
      # Dedicated wasm package (root export is the loader):
      #   dist-export: .
      # Monorepo (see publish-npm.yml): install-directory: . and
      #   working-directory: packages/foo-wasm, cargo-directory: .
