# Caller owns on:. Pin at @v2.0.0.
# OIDC path (no NPM_TOKEN). Token-only callers drop id-token and pass NPM_TOKEN.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2.0.0
    with:
      package-manager: npm
      # Monorepo: install-directory: .
      #            working-directory: packages/foo
