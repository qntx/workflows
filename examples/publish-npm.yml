# Caller owns on:. Pin at @v2.
# OIDC trusted publishing only. The caller job must grant id-token: write and
# the package needs a Trusted Publisher on npmjs.com for this repo + workflow.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    with:
      package-manager: npm
      # Monorepo: install-directory: .
      #            working-directory: packages/foo
