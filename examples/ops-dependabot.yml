# Caller owns on:. Pin at @v2.
# schedule / workflow_dispatch squash-merge green Dependabot PRs.
# Do not checkout the PR. This workflow does not approve.
# Required reviews mean this workflow never merges those PRs (skip:BLOCKED).
name: Dependabot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write
    uses: qntx/workflows/.github/workflows/ops-dependabot.yml@v2
